# Page-level texts. Every string is a {lang: text} map; `en` is required,
# other languages fall back to `en` when a key is missing.
# Markdown is allowed in `intro` and `grades.*`.

languages:            # order = order in the language switcher; first = default
  en: English
  ru: Русский

title:
  en: ML competition methods catalog
  ru: Каталог методов ML-соревнований

intro:
  en: >-
    A catalog of methods used in ML competition solutions, grouped by task type. Each method says when it
    applies, what to do and why, with a short code snippet; snippets marked *sketch* are minimal illustrations
    rather than code lifted from a solution. Methods are collapsed: click a name to open it.
  ru: >-
    Каталог методов из решений ML-соревнований, сгруппированных по типу задачи. Для каждого метода сказано,
    когда он применим, что делать и зачем, и приведён короткий фрагмент кода; фрагменты с пометкой *набросок* —
    минимальные иллюстрации, а не код из решения. Методы свёрнуты: нажмите на название, чтобы открыть.

grades_heading:
  en: Grades (they rate the idea, not whether it worked)
  ru: Оценки (оценивается идея, а не то, сработала ли она)

grades:
  book:
    en: standard technique that everyone studies. Skim these.
    ru: стандартный приём, который изучают все. Можно пролистать.
  good:
    en: simple once you see it, but not standard practice; usually a small insight about the data, the metric or the task framing.
    ru: просто, когда уже увидел, но не общепринято; обычно небольшое наблюдение о данных, метрике или постановке задачи.
  brilliant:
    en: a genuinely original use of the available data.
    ru: по-настоящему оригинальное использование доступных данных.

grade_labels:
  book: {en: BOOK, ru: КЛАССИКА}
  good: {en: GOOD, ru: ХОРОШО}
  brilliant: {en: BRILLIANT, ru: БЛЕСТЯЩЕ}

brilliant_heading:
  en: Brilliant moves
  ru: Блестящие ходы

ui:
  search: {en: "Search methods and code…", ru: "Поиск по методам и коду…"}
  expand: {en: expand everything, ru: развернуть всё}
  theme: {en: Theme, ru: Тема}
  methods: {en: methods, ru: методов}
  code: {en: Code, ru: Код}
  sketch: {en: Sketch, ru: Набросок}
  sketch_note: {en: minimal illustration, ru: минимальная иллюстрация}
  general: {en: GENERAL, ru: ОБЩИЙ}
  general_note: {en: "Generalises to a typical task, e.g. fine-tuning a transformer", ru: "Переносится на типовую задачу, например дообучение трансформера"}
  kind_all: {en: All tricks, ru: Все приёмы}
  kind_general: {en: General only, ru: Только общие}
  kind_specific: {en: Specific only, ru: Только специфичные}
  untranslated: {en: not translated yet, ru: ещё не переведено}
  language: {en: Language, ru: Язык}
  when: {en: When, ru: Когда}
  do: {en: Do, ru: Что делать}
  why: {en: Why, ru: Зачем}
  see_also: {en: See also, ru: См. также}
  glossary: {en: Glossary, ru: Глоссарий}
  glossary_intro: {en: "Terms underlined with dots in the methods; hover or tap them to see the definition in place.", ru: "Термины, подчёркнутые точками в методах; наведите или нажмите, чтобы увидеть определение на месте."}
  permalink: {en: Link to this method, ru: Ссылка на этот метод}
