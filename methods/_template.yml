# Copy this file to methods/<short-id>.yml (lowercase, hyphens). Files starting with "_" are ignored.
# The file name is the method's id: it is used in page anchors (#en-m-<id>), so avoid renaming it later.

section: universal            # an `id` from sections.yml
subsection: validation        # required if the section has subsections, omitted otherwise
order: 110                    # position inside the subsection (lower = earlier); steps of 10 leave room
grade: good                   # book | good | brilliant — rate the idea, not whether it worked

# English is required. Write the name as the general technique in standard ML terms,
# the description as the principle + why it matters; task specifics go only into `example`.
# Inline markdown (**bold**, `code`, *italic*) is allowed.
name: Short name of the technique
description: >-
  What to do, in general terms. Then the failure mode it prevents or the payoff.
example: task type, concrete instance          # rendered as "Example: ...". Optional.

sketch: false                 # true = the code is a minimal illustration, not from a real solution
code: |
  # a short, self-contained snippet with readable variable names
  ...

# Optional. Any language listed in site.yml. A method without a translation for the chosen
# language is shown in English (marked "EN"); missing fields fall back to English one by one.
translations:
  ru:
    name: Короткое название приёма
    description: >-
      Что делать в общем виде и почему это важно.
    example: тип задачи, конкретный пример
    # code: |          # optional, only if the snippet itself needs translated comments
