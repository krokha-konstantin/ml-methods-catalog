section: planning
subsection: games
order: 40
grade: book
name: Brute-force the endgame, exactly
description: >-
  When few moves remain, enumerate them all instead of using heuristics, and compare in integers (cross-multiply
  instead of dividing) so ties and boundaries are decided exactly.
code: |
  def _key(A_final, B_final):
      dist_a = abs(3 * A_final - S); dist_b = abs(3 * B_final - S)
      return (0 if dist_a <= dist_b else 1, dist_a)
  # last round: try all 6 (take, give) assignments, pick the min key
translations:
  ru:
    name: Полный перебор в эндшпиле, без погрешностей
    description: >-
      Когда ходов осталось мало, переберите их все вместо эвристик и сравнивайте в целых числах (умножайте
      крест-накрест вместо деления), чтобы ничьи и граничные случаи решались точно.
