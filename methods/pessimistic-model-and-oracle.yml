section: planning
subsection: model-based
order: 60
grade: good
name: Pessimistic model and an oracle bound
when: A plan must work on a real system the learned model only approximates.
do: >-
  Plan against a deliberately pessimistic version of the model (more noise, stricter limits, lower success
  rates), and compute a closed-loop oracle that sees the true state at every step.
why: >-
  Pessimism gives robust plans; the oracle is an upper bound on what any fixed plan can achieve.
see_also:
- learned-simulator
code: |
  # pessimistic variant of the learned model
  def pessimistic_model(margin=0.7, noise_inflation=1.35, success_mult=0.92):
      M = fit(train_data, noise_inflation=noise_inflation)        # wider noise
      M['threshold'] = {k: v - margin for k, v in THRESHOLD.items()}   # stricter limits
      M['success_mult'] = success_mult                             # lower success probability
      return M
  # oracle: per scenario, at every step pick the action with the best one-step value given the true state
translations:
  ru:
    name: Пессимистичная модель и граница оракула
    when: План должен работать на реальной системе, которую выученная модель лишь приближает.
    do: >-
      Планируйте против намеренно пессимистичной версии модели (больше шума, строже ограничения, ниже
      вероятность успеха) и посчитайте оракула с обратной связью, который видит истинное состояние на
      каждом шаге.
    why: >-
      Пессимизм даёт устойчивые планы, а оракул — верхнюю границу для любого фиксированного плана.
