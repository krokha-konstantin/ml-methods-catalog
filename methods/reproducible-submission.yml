section: universal
subsection: leaderboard
order: 60
grade: book
name: Reproducible submission with a checksum
description: >-
  Rebuild the submission from code and assert that its hash equals the file that was scored. This proves
  the final notebook really produces the submitted result.
example: clinical guideline matching, SHA-256 checked at the end of the notebook
code: |
  digest = hashlib.sha256()
  with path.open("rb") as stream:
      for chunk in iter(lambda: stream.read(1 << 20), b""):
          digest.update(chunk)
  assert digest.hexdigest() == SUBMITTED_SHA256
