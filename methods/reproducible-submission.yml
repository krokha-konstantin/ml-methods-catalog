section: universal
subsection: leaderboard
order: 60
grade: book
name: Reproducible submission with a checksum
do: Rebuild the submission from code and assert that its hash equals the file that was scored.
why: It proves that the final code really produces the submitted result.
see_also:
- sanity-check-implied-statistics
code: |
  # the rebuilt file must be byte-identical to the scored one
  digest = hashlib.sha256()
  with path.open("rb") as stream:
      for chunk in iter(lambda: stream.read(1 << 20), b""):
          digest.update(chunk)
  assert digest.hexdigest() == SUBMITTED_SHA256
translations:
  ru:
    name: Воспроизводимая посылка с контрольной суммой
    do: Пересоберите посылку из кода и проверьте, что её хэш совпадает с оценённым файлом.
    why: Это доказывает, что итоговый код действительно даёт отправленный результат.
