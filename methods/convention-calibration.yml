section: vision
subsection: geometry
order: 30
grade: good
name: Calibrate output conventions on training data
description: >-
  When a task's coordinate or sign conventions are ambiguous (which frame the translation is in, inverse
  or forward rotation), try every combination on training data and keep the one that matches the ground
  truth before tuning anything else.
code: |
  def evaluate_convention(results, r_transform, t_transform):
      for r, res in results:
          q_pred = R_to_quat_wxyz(r_transform(res["R"]))
          t_dir = t_transform(res["R"], res["t"])
          angs.append(rotation_angle_deg(q_pred, true_q(r)))
          cosines.append(np.dot(t_dir / np.linalg.norm(t_dir), true_t(r) / np.linalg.norm(true_t(r))))
      return np.mean(angs), np.mean(cosines), np.median(cosines)
