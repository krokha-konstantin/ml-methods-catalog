section: tabular
subsection: features
order: 50
grade: book
general: true
name: Categorical crosses
do: Concatenate two categorical columns into a new category.
why: A model can then learn effects that exist only for specific combinations.
see_also:
- conditioned-tokens
code: |
  # category pairs as new categories
  X['a_x_b'] = X['cat_a'].astype(str) + '_' + X['cat_b'].astype(str)
  X['a_x_c'] = X['cat_a'].astype(str) + '_' + X['cat_c'].astype(str)
translations:
  ru:
    name: Пересечения категорий
    do: Склейте два категориальных столбца в новую категорию.
    why: Тогда модель может выучить эффекты, которые есть только у конкретных сочетаний.
