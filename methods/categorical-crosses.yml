section: tabular
subsection: features
order: 50
grade: book
name: Categorical crosses
description: >-
  Concatenate two categorical columns into a new category, so a model can learn effects that exist only
  for specific combinations.
code: |
  X['material_bed_surface'] = X['material'].astype(str) + '_' + X['bed_surface'].astype(str)
  X['material_printer_model'] = X['material'].astype(str) + '_' + X['printer_model'].astype(str)
translations:
  ru:
    name: Пересечения категорий
    description: >-
      Склейте два категориальных столбца в новую категорию, чтобы модель могла выучить эффекты, которые
      есть только у конкретных сочетаний.
