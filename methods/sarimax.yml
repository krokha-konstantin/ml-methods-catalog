section: time-series
subsection: models
order: 30
grade: book
name: Per-series SARIMAX
description: >-
  A seasonal ARIMA with exogenous regressors, fitted per series. It is a strong classical baseline when
  series are long and regular.
code: |
  model = SARIMAX(ts, exog=exog_tr, order=(1, 1, 1), seasonal_order=(1, 0, 0, 12))   # log-RTO per store
translations:
  ru:
    name: SARIMAX для каждого ряда
    description: >-
      Сезонная ARIMA с внешними регрессорами, обучаемая отдельно для каждого ряда. Сильный классический
      бейзлайн, когда ряды длинные и регулярные.
