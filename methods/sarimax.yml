section: time-series
subsection: models
order: 30
grade: book
name: Per-series SARIMAX
when: Series are long and regular.
do: Fit a seasonal ARIMA with exogenous regressors (SARIMAX) per series.
why: It is a strong classical baseline to compare learned models against.
code: |
  # per-series seasonal ARIMA with exogenous regressors
  model = SARIMAX(np.log(series), exog=exog_train, order=(1, 1, 1), seasonal_order=(1, 0, 0, 12)).fit()
translations:
  ru:
    name: SARIMAX для каждого ряда
    when: Ряды длинные и регулярные.
    do: Обучите для каждого ряда сезонную ARIMA с внешними регрессорами (SARIMAX).
    why: Это сильный классический бейзлайн, с которым стоит сравнивать обучаемые модели.
