section: nlp
order: 90
grade: book
name: Expand abbreviations
when: The domain uses many abbreviations.
do: Replace them with their full forms from a dictionary before vectorising.
why: Both spellings then map to the same tokens.
code: |
  # e.g. "MI" → "myocardial infarction"
  return ABBREVIATION_RE.sub(lambda m: ABBREVIATIONS[m.group(1)], normalize_text(text))
translations:
  ru:
    name: Раскрывайте сокращения
    when: В предметной области много сокращений.
    do: Заменяйте их полными формами из словаря перед векторизацией.
    why: Тогда оба написания дают одни и те же токены.
