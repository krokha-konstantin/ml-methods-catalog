section: time-series
subsection: models
order: 20
grade: book
name: Isolation Forest as an unsupervised component
when: Labels are few or possibly incomplete.
do: >-
  Add an unsupervised anomaly score (Isolation Forest) and blend it with the supervised models rather
  than using it alone.
why: It adds a view that doesn't depend on the labels.
see_also:
- volatility-ratio
code: |
  # unsupervised anomaly score as one more ensemble member
  iso = IsolationForest(n_estimators=300, max_samples=0.5, contamination=0.05).fit(X_train)
  iso_score = -iso.score_samples(X_train)
translations:
  ru:
    name: Isolation Forest как компонент без учителя
    when: Меток мало или они, возможно, неполны.
    do: >-
      Добавьте оценку аномальности без учителя (Isolation Forest) и смешивайте её с моделями с учителем,
      а не используйте отдельно.
    why: Она добавляет взгляд, не зависящий от меток.
