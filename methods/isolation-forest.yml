section: time-series
subsection: models
order: 20
grade: book
name: Isolation Forest as an unsupervised component
description: >-
  An unsupervised anomaly score adds a view that does not depend on the (few, possibly incomplete) labels.
  Blend it with supervised models rather than using it alone.
code: |
  iso = IsolationForest(n_estimators=300, max_samples=0.5, contamination=0.05).fit(Wtr)
  iso_tr = -iso.score_samples(Wtr)
translations:
  ru:
    name: Isolation Forest как компонент без учителя
    description: >-
      Оценка аномальности без учителя добавляет взгляд, не зависящий от (немногочисленных, возможно неполных)
      меток. Смешивайте её с моделями с учителем, а не используйте отдельно.
