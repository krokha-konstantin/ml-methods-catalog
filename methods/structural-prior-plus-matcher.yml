section: tracking
order: 50
grade: good
name: Smooth spatial prior + local matcher
when: >-
  A coarse estimate can be interpolated from spatial neighbours, and a local signal matcher is available.
do: 'Combine them: use the neighbour-based estimate as a prior and let the matcher refine it.'
why: >-
  The prior keeps the matcher from drifting; the matcher corrects the prior's coarseness. Neither alone
  reaches the accuracy of both.
see_also:
- sequence-alignment
code: |
  # prior: inverse-distance weighted plane fit through the k nearest neighbours
  class NeighbourPlanePrior:
      def predict(self, xy_q, self_id=None, k=K):
          dist, idx = self.tree.query(xy_q / self.scale, k=k + 5)
          dist = np.where(idx == self.index.get(self_id, -1), np.inf, dist)   # never use the point itself
          w = 1. / (dist + 1e-3)
          # weighted least squares for z = a·x + b·y + c per layer
          coef = np.linalg.solve(A, rhs)
          return Xq[:, None] * coef[:, 0, :] + Yq[:, None] * coef[:, 1, :] + coef[:, 2, :]
translations:
  ru:
    name: Гладкий пространственный априор + локальное сопоставление
    when: >-
      Грубую оценку можно интерполировать по пространственным соседям, и есть локальное сопоставление
      сигнала.
    do: >-
      Объедините их: оценку по соседям используйте как априор, а сопоставление пусть её уточняет.
    why: >-
      Априор не даёт сопоставлению уплыть; сопоставление исправляет грубость априора. По отдельности ни
      один не достигает точности их комбинации.
