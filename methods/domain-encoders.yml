section: nlp
order: 100
grade: book
general: true
name: Pretrained domain encoders as an extra branch
when: A pretrained encoder exists for the text's domain.
do: >-
  Use its embeddings (frozen, or fine-tuned for retrieval) as an additional model in the ensemble. Check
  the tokenizer first.
why: >-
  Domain pretraining adds knowledge the other models lack, but an encoder whose vocabulary barely covers
  the language splits words into characters and adds nothing.
see_also:
- bi-encoder-ranking
sketch: true
code: |
  # cosine similarity of mean-pooled encoder embeddings as one ensemble branch
  emb = mean_pooled(encoder(**tokenizer(texts, padding=True, truncation=True, return_tensors="pt")))
  branch_score = cosine(emb_query, emb_doc)
translations:
  ru:
    name: Предобученные доменные энкодеры как дополнительная ветвь
    when: Для предметной области текста есть предобученный энкодер.
    do: >-
      Используйте его эмбеддинги (замороженного или дообученного для поиска) как дополнительную модель
      в ансамбле. Сначала проверьте токенизатор.
    why: >-
      Доменное предобучение добавляет знания, которых нет у других моделей, но энкодер, словарь которого
      почти не покрывает язык, разбивает слова на символы и ничего не добавляет.
