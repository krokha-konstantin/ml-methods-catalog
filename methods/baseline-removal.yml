section: signals
order: 20
grade: book
name: Remove baseline drift
description: >-
  Subtract the slow drift of the signal before extracting features, so amplitude features measure the
  waveform itself and not where the baseline happened to be.
code: |
  def baseline_correction(x):
      baseline = 0.5 * np.sin(np.arange(x.shape[1]) / 45)
      return x - baseline
translations:
  ru:
    name: Убирайте дрейф базовой линии
    description: >-
      Вычитайте медленный дрейф сигнала перед извлечением признаков, чтобы амплитудные признаки измеряли
      саму форму волны, а не случайное положение базовой линии.
