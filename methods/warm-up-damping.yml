section: time-series
subsection: postprocessing
order: 20
grade: good
name: Damp predicted changes near the forecast start
when: A model predicts the change from the last observation.
do: >-
  Multiply the predicted change by a factor that rises from 0 to 1 with the distance from the forecast
  start.
why: >-
  Right after the last observation the true change is small, and the predicted change is mostly noise.
see_also:
- predict-the-change
code: |
  # damping that rises from 0 to 1 with distance from the last observation
  def warmup(steps_since_last, tau):
      return 1. - np.exp(-np.maximum(steps_since_last, 0.) / tau)
  pred = last_value + alpha * warmup(df["steps_since_last"].values, tau) * model_delta
translations:
  ru:
    name: Приглушайте предсказанные изменения у начала прогноза
    when: Модель предсказывает изменение относительно последнего наблюдения.
    do: >-
      Умножайте предсказанное изменение на множитель, растущий от 0 до 1 с удалением от начала прогноза.
    why: >-
      Сразу после последнего наблюдения истинное изменение мало, а предсказанное — в основном шум.
