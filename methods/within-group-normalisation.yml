section: tabular
subsection: features
order: 60
grade: book
name: Within-group normalisation
when: Rows belong to groups with different baselines (materials, sessions, devices).
do: >-
  Express a value relative to its own group: a z-score against the group's mean and std, fitted on training
  data only.
why: >-
  "Unusual for this group" is often more predictive than the raw value, which mixes the group's baseline
  with the deviation.
see_also:
- group-aggregate-features
code: |
  # z-score against the row's own group
  stats = X_train.groupby('group')[cols].agg(['mean', 'std'])          # fit on train only
  for col in cols:
      mean = X['group'].map(stats[(col, 'mean')])
      std = X['group'].map(stats[(col, 'std')]).replace(0, np.nan)
      X[f'{col}_group_z'] = (X[col] - mean) / std
      X[f'{col}_group_absz'] = X[f'{col}_group_z'].abs()
translations:
  ru:
    name: Нормализация внутри группы
    when: Строки принадлежат группам с разным базовым уровнем (материалы, сессии, устройства).
    do: >-
      Выражайте значение относительно его группы: z-оценка относительно среднего и стандартного отклонения
      группы, посчитанных только на обучающих данных.
    why: >-
      «Необычно для этой группы» часто предсказывает лучше сырого значения, в котором смешаны базовый
      уровень группы и отклонение от него.
