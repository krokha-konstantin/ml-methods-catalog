translations:
  ru:
    name: Нормализация внутри группы
    description: >-
      Выражайте значение относительно его группы: z-оценка относительно среднего и стандартного отклонения
      группы. «Необычно для этой группы» часто предсказывает лучше, чем сырое значение, в котором смешаны
      базовый уровень группы и отклонение от него. Статистики групп считайте только на обучающих данных.
