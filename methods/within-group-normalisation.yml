order: 60
grade: book
name: Within-group normalisation
description: >-
  Express a value relative to its own group: a z-score against the group's mean and std. "Unusual for
  this group" is often more predictive than the raw value, which mixes the group's baseline with the deviation.
  Fit the group statistics on training data only.
code: |
  def add_group_zscore(X, stats, group_col, cols, prefix):
      for col in cols:
          mean = X[group_col].map(stats[f'{col}_mean'])
          std = X[group_col].map(stats[f'{col}_std']).replace(0, np.nan)
          z = (X[col] - mean) / std
          X[f'{prefix}_{col}_stndrd_zscore'] = z
          X[f'{prefix}_{col}_abs_zscore'] = z.abs()
