section: nlp
order: 140
grade: book
name: Token-probability features for LLM answers
when: Answers come from an LLM and their reliability has to be judged.
do: >-
  Summarise the generator's token probabilities over the answer (minimum, mean, spread, negative log-likelihood
  per token).
why: Low-confidence tokens are a strong signal that an answer is made up.
see_also:
- self-consistency
code: |
  # token-probability statistics of one answer
  features[f'mtp_{idx}'] = np.min(p)
  features[f'avgtp_{idx}'] = np.mean(p)
  features[f'mpd_{idx}'] = np.max(p) - np.min(p)
  features[f'g_nll_{idx}'] = -np.sum(np.log(p + 1e-12)) / len(p)
translations:
  ru:
    name: Признаки из вероятностей токенов ответа LLM
    when: Ответы дала LLM, и нужно оценить их надёжность.
    do: >-
      Суммируйте вероятности токенов, выданные генератором для ответа (минимум, среднее, разброс, отрицательное
      лог-правдоподобие на токен).
    why: Токены с низкой уверенностью — сильный сигнал того, что ответ выдуман.
