section: universal
subsection: leaderboard
order: 10
grade: good
name: Leaderboard scores as a likelihood
when: >-
  The target is produced by a hidden stochastic system, and leaderboard scores of earlier submissions
  are known.
do: >-
  Simulate the system many times and weight each simulated world by how well it reproduces the real leaderboard
  scores; optimise the next submission under these weights.
why: The leaderboard becomes evidence about the hidden system instead of just a score.
see_also:
- expected-improvement-objective
- learned-simulator
code: |
  # weight simulated scenarios by how well they reproduce past leaderboard scores
  obs = np.array(past_lb_scores, float)            # real LB scores of plans already submitted
  sim = simulated_scores                           # (n_scenarios, n_past_plans), same plans in the simulator
  ll = -((sim - obs) ** 2).sum(1) / (2 * SIG ** 2) # SIG = 25
  w = np.exp(ll - ll.max()); w /= w.sum()          # posterior weight of each simulated scenario
  ess = 1 / (w ** 2).sum()                         # effective sample size, sanity check
  best_plan = max(candidates, key=lambda plan: (w * simulate(plan)).sum())
translations:
  ru:
    name: Результаты лидерборда как правдоподобие
    when: >-
      Целевая величина порождается скрытой стохастической системой, и результаты прошлых посылок на лидерборде
      известны.
    do: >-
      Промоделируйте систему много раз и взвесьте каждый смоделированный мир по тому, насколько он воспроизводит
      реальные результаты; оптимизируйте следующую посылку с этими весами.
    why: Лидерборд становится свидетельством о скрытой системе, а не просто оценкой.
