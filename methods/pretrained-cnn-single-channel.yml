section: vision
subsection: matching
order: 40
grade: book
name: ImageNet weights for single-channel inputs
description: >-
  To use an RGB-pretrained CNN on a one-channel input (a spectrogram, a radar map), replace the first
  convolution with a one-channel version whose weights are the mean of the original RGB weights. The rest
  of the pretrained network stays usable.
code: |
  base = resnet34(weights=ResNet34_Weights.DEFAULT)
  self.conv1 = nn.Conv2d(1, 64, kernel_size=7, stride=2, padding=3, bias=False)
  self.conv1.weight = nn.Parameter(base.conv1.weight.mean(dim=1, keepdim=True))
translations:
  ru:
    name: Веса ImageNet для одноканальных входов
    description: >-
      Чтобы использовать предобученную на RGB свёрточную сеть на одноканальном входе (спектрограмма, радарная
      карта), замените первую свёртку одноканальной, веса которой — среднее исходных весов по RGB. Остальная
      предобученная сеть остаётся пригодной.
