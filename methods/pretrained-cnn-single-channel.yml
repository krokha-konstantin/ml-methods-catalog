section: vision
subsection: matching
order: 40
grade: book
general: true
name: ImageNet weights for single-channel inputs
when: An RGB-pretrained CNN has to take a one-channel input (a spectrogram, a radar map).
do: >-
  Replace the first convolution with a one-channel version whose weights are the mean of the original
  RGB weights.
why: The rest of the pretrained network stays usable.
code: |
  # one-channel first conv initialised from the mean RGB filter
  base = resnet34(weights=ResNet34_Weights.DEFAULT)
  self.conv1 = nn.Conv2d(1, 64, kernel_size=7, stride=2, padding=3, bias=False)
  self.conv1.weight = nn.Parameter(base.conv1.weight.mean(dim=1, keepdim=True))
translations:
  ru:
    name: Веса ImageNet для одноканальных входов
    when: >-
      Предобученную на RGB свёрточную сеть нужно применить к одноканальному входу (спектрограмма, радарная
      карта).
    do: Замените первую свёртку одноканальной, веса которой — среднее исходных весов по RGB.
    why: Остальная предобученная сеть остаётся пригодной.
