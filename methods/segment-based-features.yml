section: signals
order: 10
grade: good
name: Features from domain-defined segments
when: The signal has a landmark (e.g. the main peak) that experts read it around.
do: Locate the landmark and compute features separately on the segments before and after it.
why: A few such features with a small model can beat hundreds of raw samples.
see_also:
- baseline-removal
code: |
  # segments before/after the main peak, features on each
  center = (x.argmin(axis=1) + x.argmax(axis=1)) // 2
  period = (1.5 * (x.argmax(axis=1) - x.argmin(axis=1))).astype(int)
  pre = [row[:end] for row, end in zip(x, center - period)]
  post = [row[start:] for row, start in zip(x, center + period)]
  jitter = np.array([np.abs(np.diff(seg)).sum() for seg in pre])   # baseline roughness before the peak
  step_after = np.array([seg[:20].mean() - seg[20:40].mean() for seg in post])   # level shift after it
translations:
  ru:
    name: Признаки по сегментам, заданным предметной областью
    when: >-
      У сигнала есть опорная точка (например, главный пик), относительно которой его читают эксперты.
    do: Найдите опорную точку и считайте признаки отдельно на сегментах до и после неё.
    why: Несколько таких признаков с небольшой моделью могут превзойти сотни сырых отсчётов.
