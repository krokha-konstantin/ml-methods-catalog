section: tabular
subsection: models
order: 30
grade: book
name: Univariate AUC filter
description: >-
  Drop features whose single-feature ROC-AUC (taken as max(AUC, 1 − AUC)) is close to 0.5. It is a cheap
  first cut on a large generated feature set.
code: |
  for c in Xtr_mw.columns:
      a = roc_auc_score(y, Xtr_mw[c].values)
      aucs[c] = max(a, 1 - a)
  keep = [c for c, a in aucs.items() if a > 0.52]
translations:
  ru:
    name: Фильтр по одномерному AUC
    description: >-
      Убирайте признаки, у которых ROC-AUC по одному признаку (берётся max(AUC, 1 − AUC)) близок к 0.5.
      Это дешёвый первый отсев большого сгенерированного набора признаков.
