section: signals
order: 40
grade: book
name: Attention pooling over a recurrent network
description: >-
  Instead of using only the last hidden state, learn a weight for every time step and pool the weighted
  states, so information from anywhere in the sequence reaches the output.
code: |
  energy = torch.tanh(self.attn_weights(lstm_output)).squeeze(2)
  attention_scores = torch.softmax(energy, dim=1)
  context = (lstm_output * attention_scores.unsqueeze(2)).sum(1)
translations:
  ru:
    name: Пулинг вниманием поверх рекуррентной сети
    description: >-
      Вместо использования только последнего скрытого состояния выучите вес для каждого шага и объединяйте
      взвешенные состояния, чтобы информация из любой части последовательности доходила до выхода.
