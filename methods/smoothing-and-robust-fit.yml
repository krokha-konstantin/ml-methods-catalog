section: time-series
subsection: postprocessing
order: 30
grade: book
name: Smoothing and a robust trend fit
when: A predicted trajectory is noisy and may contain outliers.
do: >-
  Smooth it with a Savitzky–Golay filter, fit a low-degree polynomial with iteratively reweighted least
  squares (IRLS), and blend the fit with the prediction.
why: IRLS down-weights outliers, so the trend follows the bulk of the points.
see_also:
- huber-loss
code: |
  # Savitzky–Golay smoothing, then a robust polynomial trend via IRLS
  out[pos] = savgol_filter(v, wl, 3)
  def _robfit(s, y, deg=5):
      c = np.polyfit(s, y, deg)
      for _ in range(4):
          r = y - np.polyval(c, s)
          sc = np.median(np.abs(r)) * 1.4826 + 1e-6
          c = np.polyfit(s, y, deg, w=1.0 / (1.0 + (r / (2.0 * sc)) ** 2))
      return np.polyval(c, s)
translations:
  ru:
    name: Сглаживание и робастная аппроксимация тренда
    when: Предсказанная траектория шумная и может содержать выбросы.
    do: >-
      Сгладьте её фильтром Савицкого–Голея, подберите полином низкой степени итеративно перевзвешенным
      МНК (IRLS) и смешайте его с предсказанием.
    why: IRLS уменьшает вес выбросов, поэтому тренд следует за основной массой точек.
