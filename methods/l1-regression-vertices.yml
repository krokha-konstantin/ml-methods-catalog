section: theory
order: 40
grade: good
name: The L1 regression optimum passes through data points
description: >-
  Least-absolute-deviation regression is a linear program, so an optimal line passes through at least
  two data points: enumerating all pairs finds the exact optimum.
example: olympiad theory problem, minimum MAE of a line
code: |
  for i in range(n):
      for j in range(i + 1, n):
          if xs[j] == xs[i]: continue
          a = (ys[j] - ys[i]) / (xs[j] - xs[i]); b = ys[i] - a * xs[i]
          L = np.abs(a * xs + b - ys).mean()
          if L < bestL: bestL, besta, bestb = L, a, b
translations:
  ru:
    name: Оптимум L1-регрессии проходит через точки данных
    description: >-
      Регрессия по наименьшим абсолютным отклонениям — задача линейного программирования, поэтому оптимальная
      прямая проходит хотя бы через две точки данных: перебор всех пар находит точный оптимум.
    example: олимпиадная задача, минимальная MAE прямой
