section: tabular
subsection: features
order: 80
grade: good
name: Link additional data to the training rows
when: >-
  Additional data is given that describes the same objects as the training set (with extra columns, or
  noisier values).
do: >-
  Match each training row to its counterpart by nearest neighbour on the shared, scaled columns (record
  linkage) and add the extra columns as features. If rows can't be matched reliably, train a model that
  predicts the extra columns from the shared ones and use its predictions instead.
why: >-
  The extra columns carry information the training set lacks; linking recovers their true values, and
  the model-based fallback still recovers their predictable part.
see_also:
- public-test-leakage-check
code: |
  # record linkage by nearest neighbour; fallback: predict the extra columns
  shared = sorted(set(train.columns) & set(extra.columns))
  extra_cols = [c for c in extra.columns if c not in train.columns]

  scale = extra[shared].std()
  nn = NearestNeighbors(n_neighbors=1).fit(extra[shared] / scale)
  dist, idx = nn.kneighbors(train[shared] / scale)
  train[extra_cols] = extra.iloc[idx[:, 0]][extra_cols].to_numpy()
  # check the dist histogram: true matches sit at the noise level, far below the next neighbour

  model = CatBoostRegressor(objective='MultiRMSE').fit(extra[shared], extra[extra_cols])   # fallback
  train[extra_cols] = model.predict(train[shared])
translations:
  ru:
    name: Свяжите дополнительные данные со строками обучающей выборки
    when: >-
      Даны дополнительные данные о тех же объектах, что и в обучающей выборке (с лишними столбцами или
      более шумными значениями).
    do: >-
      Сопоставьте каждой обучающей строке её пару ближайшим соседом по общим отмасштабированным столбцам
      (record linkage) и добавьте лишние столбцы как признаки. Если строки нельзя надёжно сопоставить,
      обучите модель, предсказывающую лишние столбцы по общим, и используйте её предсказания.
    why: >-
      Лишние столбцы несут информацию, которой нет в обучающей выборке; связывание восстанавливает их
      истинные значения, а запасной вариант с моделью — хотя бы их предсказуемую часть.
