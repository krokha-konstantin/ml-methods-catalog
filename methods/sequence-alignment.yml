section: tracking
order: 20
grade: book
name: Sequence alignment by dynamic programming
description: >-
  Align a measured signal to a reference signal by minimising a cost of mismatch plus a penalty for moving
  along the reference (dynamic time warping / Viterbi; beam search for a cheaper approximation).
code: |
  for step in range(n):
      for bi in range(bn):
          for d in range(-2, 3):                 # move at most 2 reference cells per step
              ni = bidx[bi] + d
              c = bcost[bi] + (sgr[step] - tw_gr[ni]) ** 2 / es + mc * abs(d)
              ...                                # keep the BS cheapest candidates
translations:
  ru:
    name: Выравнивание последовательностей динамическим программированием
    description: >-
      Выравнивайте измеренный сигнал по эталонному, минимизируя стоимость несовпадения плюс штраф за перемещение
      по эталону (динамическая трансформация времени / Витерби; лучевой поиск как более дешёвое приближение).
