section: planning
subsection: model-based
order: 50
grade: good
name: Coordinate ascent with cached prefixes
when: A long sequential plan is optimised against a simulator.
do: >-
  Improve it one step at a time, trying every action at that step while keeping the rest; cache the simulated
  state before each step.
why: Changing step i only re-simulates from i onward.
see_also:
- common-random-numbers
code: |
  # coordinate ascent over plan steps, resuming from cached states
  for i in range(100):                              # one step at a time
      for k in [REST] + candidates[i]:
          pl = plan.copy(); pl[i] = k
          v = value(simulate(pl, start=i, cache=hist))  # resume from the cached state at step i
          if v > bv + 1e-9: bv, best = v, k
      plan[i] = best; hist = simulate(plan, start=i, cache=hist)
translations:
  ru:
    name: Покоординатный подъём с кешированием префиксов
    when: Длинный последовательный план оптимизируется по симулятору.
    do: >-
      Улучшайте его по одному шагу, пробуя на этом шаге каждое действие при неизменном остальном; кешируйте
      смоделированное состояние перед каждым шагом.
    why: Изменение шага i требует пересчёта только начиная с i.
