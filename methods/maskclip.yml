section: vision
subsection: matching
order: 30
grade: good
name: Score many image regions in one forward pass
description: >-
  Add one extra token per candidate region to a vision transformer and restrict its attention to the patches
  of that region. One forward pass then yields an embedding for every candidate, which can be compared
  with text embeddings for zero-shot localisation (MaskCLIP).
code: |
  attention_mask[:N+1, N+1:] = True                 # patches never see mask tokens
  attention_mask[N+1:, 1:N+1] = True                # mask tokens see nothing...
  for mask_idx in range(M):
      for patch_idx in self.region_to_patches[mask_idx]:
          attention_mask[N + 1 + mask_idx, 1 + patch_idx] = False   # ...except their own rectangle
translations:
  ru:
    name: Оценка многих областей изображения за один проход
    description: >-
      Добавьте в визуальный трансформер по дополнительному токену на каждую область-кандидат и ограничьте
      его внимание патчами этой области. Один прямой проход даёт эмбеддинг для каждого кандидата, который
      можно сравнить с текстовыми эмбеддингами для локализации без обучения (MaskCLIP).
