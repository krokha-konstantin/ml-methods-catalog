section: puzzles
subsection: theory
order: 70
grade: book
name: Numeric cross-check of an analytic answer
when: An analytic answer (a bound, an optimum) has been derived.
do: Confirm it by constrained optimisation (SLSQP) from many random starting points.
why: Agreement between the two is strong evidence that both are right.
code: |
  # SLSQP from 300 random starts
  for _ in range(300):
      x0 = np.sort(np.clip(np.linspace(0, 1, N) + rng.normal(0, 0.03, N), 0, 1))
      res = minimize(obj, x0, method="SLSQP", bounds=[(0, 1)] * N, constraints=CONS)
translations:
  ru:
    name: Численная проверка аналитического ответа
    when: Получен аналитический ответ (оценка, оптимум).
    do: Подтвердите его условной оптимизацией (SLSQP) из многих случайных начальных точек.
    why: Совпадение двух ответов — сильное свидетельство, что оба верны.
