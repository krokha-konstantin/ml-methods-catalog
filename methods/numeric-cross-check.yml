section: theory
order: 70
grade: book
name: Numeric cross-check of an analytic answer
description: >-
  Confirm an analytic bound by constrained optimisation (SLSQP) from many random starting points; agreement
  between the two is strong evidence that both are right.
code: |
  for _ in range(300):
      x0 = np.sort(np.clip(np.linspace(0, 1, N) + rng.normal(0, 0.03, N), 0, 1))
      res = minimize(obj, x0, method="SLSQP", bounds=[(0, 1)] * N, constraints=CONS)
translations:
  ru:
    name: Численная проверка аналитического ответа
    description: >-
      Подтвердите аналитическую оценку условной оптимизацией (SLSQP) из многих случайных начальных точек;
      совпадение двух ответов — сильное свидетельство, что оба верны.
