section: time-series
subsection: features
order: 50
grade: good
name: Short-to-long volatility ratio
when: A regime change shows up as unusual variability rather than an unusual level.
do: >-
  Divide a short-window rolling std by a long-window one; with many sensors, aggregate the ratios across
  them (sum, count above a threshold, max, top-k mean).
why: >-
  Values well above 1 flag a change of regime even when the level stays within normal bounds.
see_also:
- isolation-forest
code: |
  # short/long rolling std per sensor, aggregated across sensors
  g = df.groupby("session_id")
  for s in SENSORS:
      long_std = g[s].transform(lambda c: c.rolling(150, min_periods=10).std())
      short_std = g[s].transform(lambda c: c.rolling(10, min_periods=3).std())
      R[s] = (short_std / (long_std + 1e-9)).fillna(1.0)
  df["sum_ratio"] = R[SENSORS].sum(1)
  df["vote_ratio"] = (R[SENSORS] > 1.3).sum(1)
  df["top3_ratio"] = np.sort(R[SENSORS].values, 1)[:, -3:].mean(1)
translations:
  ru:
    name: Отношение краткосрочной волатильности к долгосрочной
    when: Смена режима проявляется необычной изменчивостью, а не необычным уровнем.
    do: >-
      Делите скользящее стандартное отклонение по короткому окну на отклонение по длинному; при многих
      датчиках агрегируйте отношения по ним (сумма, число превышений порога, максимум, среднее топ-k).
    why: Значения заметно больше 1 отмечают смену режима, даже если уровень остаётся в норме.
