section: nlp
order: 110
grade: book
name: Align word labels to subword tokens
description: >-
  For token classification with a transformer, give each word's label to its first subword and mask the
  remaining subwords (label −100) so each word is scored exactly once.
example: text normalisation tagging, XLM-R with BIO labels
code: |
  for wid in tokenized.word_ids(batch_index=i):
      if wid is None: label_ids.append(-100)
      elif wid != prev_word_id: label_ids.append(label2id[labels[wid]])
      else: label_ids.append(-100)          # only the first sub-token is scored
      prev_word_id = wid
translations:
  ru:
    name: Сопоставьте метки слов подсловным токенам
