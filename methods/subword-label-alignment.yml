section: nlp
order: 110
grade: book
name: Align word labels to subword tokens
when: >-
  Token classification is done with a transformer whose tokenizer splits words into subwords.
do: Give each word's label to its first subword and mask the remaining subwords (label −100).
why: Each word is scored exactly once, matching how word-level metrics count.
code: |
  # label the first subword of each word, mask the rest
  for wid in tokenized.word_ids(batch_index=i):
      if wid is None: label_ids.append(-100)
      elif wid != prev_word_id: label_ids.append(label2id[labels[wid]])
      else: label_ids.append(-100)          # only the first sub-token is scored
      prev_word_id = wid
translations:
  ru:
    name: Сопоставьте метки слов подсловным токенам
    when: >-
      Классификация токенов делается трансформером, токенизатор которого делит слова на подслова.
    do: Отдавайте метку слова его первому подслову, а остальные подслова маскируйте (метка −100).
    why: Каждое слово оценивается ровно один раз, как в метриках на уровне слов.
