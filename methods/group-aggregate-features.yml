section: time-series
subsection: features
order: 20
grade: book
name: Group aggregates and shares
when: Series belong to higher-level groups (region, city).
do: Add lagged averages over the group and each series' share of its group's total.
why: They give each series context about its neighbours and its relative position.
see_also:
- lag-and-rolling-features
- within-group-normalisation
code: |
  # lagged group mean and the change of a series' share in its group
  agg = df.groupby(['region', 't'])['sales'].mean().rename('region_mean').reset_index()
  agg['t'] += lag                                           # value known `lag` periods ago
  df = df.merge(agg, on=['region', 't'], how='left')
  df['share_trend'] = g['city_share'].shift(1) - g['city_share'].shift(3)
translations:
  ru:
    name: Агрегаты по группам и доли
    when: Ряды входят в группы более высокого уровня (регион, город).
    do: Добавьте лаговые средние по группе и долю каждого ряда в итоге его группы.
    why: Они дают каждому ряду контекст о соседях и о его относительном положении.
