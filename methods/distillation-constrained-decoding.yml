section: nlp
order: 130
grade: good
general: true
name: Distil a large LLM into a small one, with constrained decoding
when: >-
  A large LLM solves the task but is too slow or too expensive to run, and outputs must follow a schema.
do: >-
  Let the large model generate synthetic training examples, fine-tune a small model on them with LoRA,
  and at inference restrict decoding to a JSON schema whose fields only allow valid values.
why: The small model inherits the behaviour, and its outputs are always valid.
code: |
  # teacher generates data in a schema; LoRA student; schema-guided decoding
  ValidValue = Literal[*valid_values]
  class Output(BaseModel):
      field_1: List[ValidValue]; field_2: List[ValidValue]
  synthetic = await client.beta.chat.completions.parse(model=TEACHER, messages=messages, response_format=Output)
  student = FastLanguageModel.get_peft_model(small_model, r=32, target_modules=[...])
  SamplingParams(guided_decoding=GuidedDecodingParams(json=Output.model_json_schema()))
translations:
  ru:
    name: Дистилляция большой LLM в маленькую с ограниченным декодированием
    when: >-
      Большая LLM решает задачу, но слишком медленна или дорога, а ответы должны следовать схеме.
    do: >-
      Пусть большая модель сгенерирует синтетические обучающие примеры, дообучите на них маленькую модель
      с LoRA, а при инференсе ограничьте декодирование JSON-схемой, поля которой допускают только корректные
      значения.
    why: Маленькая модель наследует поведение, а её ответы всегда корректны.
