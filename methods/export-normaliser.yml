section: planning
subsection: rl
order: 30
grade: book
name: Export the normaliser with the weights
when: >-
  The policy was trained on normalised observations and will run outside the training framework.
do: Ship the normaliser's mean and variance with the network weights.
why: A plain re-implementation of the network then reproduces the trained behaviour.
code: |
  # save the observation statistics next to the weights
  obs_mean = venv.obs_rms.mean; obs_std = np.sqrt(venv.obs_rms.var + venv.epsilon)
  save_submission(args.out, W1, b1, W2, b2, W3, b3, obs_mean, obs_std)
  # at inference: x = clip((obs - mean) / std, -10, 10)
translations:
  ru:
    name: Экспортируйте нормализатор вместе с весами
    when: >-
      Политика обучалась на нормализованных наблюдениях и будет работать вне фреймворка обучения.
    do: Передавайте среднее и дисперсию нормализатора вместе с весами сети.
    why: Тогда простая реализация сети воспроизводит обученное поведение.
