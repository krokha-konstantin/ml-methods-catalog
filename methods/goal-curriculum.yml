section: planning
subsection: rl
order: 20
grade: good
name: Curriculum by goal resampling
when: The task is goal-conditioned and some goals are much harder than others.
do: >-
  During training only, oversample the hard goals (re-draw the goal from the hard range with some probability).
why: The policy gets more practice where it fails without changing the evaluation distribution.
code: |
  # on reset, sometimes replace the goal with one from the hard range
  def reset(self, **kwargs):
      obs, info = self.env.reset(**kwargs)
      if self.env.unwrapped.np_random.uniform() < self.high_prob:
          new_target = float(self.env.unwrapped.np_random.uniform(2.5, 5.0))
          self.env.v_target = new_target
          obs = np.append(obs[:-1], new_target)
      return obs, info
translations:
  ru:
    name: Учебный план через пересэмплирование целей
    when: Задача с заданной целью, и некоторые цели гораздо труднее других.
    do: >-
      Только во время обучения чаще выбирайте трудные цели (с некоторой вероятностью пересэмплируйте цель
      из трудного диапазона).
    why: Политика больше тренируется там, где ошибается, а распределение при оценке не меняется.
