section: tabular
subsection: features
order: 70
grade: good
name: Features from domain physics
description: >-
  Compute the quantities the domain itself uses: flow rate from speed × layer height × nozzle size, colour
  indices from magnitude differences, the sun's elevation from coordinates and time. A model would need
  far more data to discover these formulas, and in a neural network such a value can also condition the
  hidden layers.
example: rain segmentation from satellite bands, solar elevation scaling the U-Net bottleneck
code: |
  X['flow_rate'] = X['print_speed_mm_s'] * X['layer_height_mm'] * X['nozzle_diameter_mm']
  X['layer_nozzle_ratio'] = X['layer_height_mm'] / X['nozzle_diameter_mm']
  df['B-V'] = df['Bmag'] - df['Vmag']
  df['Vmag_SNR'] = df['Vmag'] / df['e_Vmag']

  decl = 23.44 * math.sin(math.radians(360 / 365 * (N - 81)))
  H = math.radians(15 * (local_time - 12))
  sin_h = math.sin(phi) * math.sin(delta) + math.cos(phi) * math.cos(delta) * math.cos(H)
  # in the U-Net:
  m = self.mid(self.pool(e4))
  m = m * a.view(-1, 1, 1, 1)
translations:
  ru:
    name: Признаки из физики предметной области
    description: >-
      Вычислите величины, которыми пользуется сама предметная область: расход материала из скорости ×
      высоты слоя × диаметра сопла, цветовые индексы из разностей звёздных величин, высоту Солнца по координатам
      и времени. Модели понадобилось бы гораздо больше данных, чтобы открыть эти формулы, а в нейросети
      такое значение может ещё и модулировать скрытые слои.
    example: >-
      сегментация дождя по спутниковым каналам, высота Солнца масштабирует бутылочное горлышко U-Net
