section: universal
subsection: validation
order: 110
grade: book
name: Reproduce the competition metric exactly
description: >-
  Re-implement the official metric locally, including its edge cases (how predictions are matched to targets,
  how malformed spans are decoded). Every threshold sweep and model comparison is then made on the number
  that is actually scored, not on a convenient proxy.
example: >-
  tornado detection, F1 with Hungarian matching at IoU ≥ 0.5; span tagging, span-F1 with the contest's
  rule for an I-tag without a B-tag
code: |
  def count_tp(pred, gt):
      m = np.array([[iou(p, g) >= 0.5 for g in gt] for p in pred], dtype=float)
      r, c = linear_sum_assignment(-m)
      return int(m[r, c].sum())
  for conf in np.arange(0.1, 0.7, 0.05): ...   # F1 = 2tp / (2tp + fp + fn)

  elif tag.startswith("I-"):
      if cur_cls is not None and cur_cls == cls:
          pass                                   # continue the span
      else:                                      # I-X without an open X starts a new span
          if cur_cls is not None: spans.append((sent_id, cur_start, i - 1, cur_cls))
          cur_cls, cur_start = cls, i
translations:
  ru:
    name: Точно воспроизведите метрику соревнования
    description: >-
      Реализуйте официальную метрику локально со всеми её крайними случаями (как предсказания сопоставляются
      с целями, как разбираются некорректные спаны). Тогда подбор порогов и сравнение моделей идут по
      той величине, которая реально оценивается, а не по удобному заменителю.
    example: >-
      детекция торнадо, F1 с венгерским сопоставлением при IoU ≥ 0.5; разметка спанов, span-F1 с правилом
      соревнования для I-тега без B-тега
