section: universal
subsection: ensembling
order: 10
grade: book
name: Bagging
do: >-
  Average the predictions of models that differ only by random seed, CV fold, bootstrap sample or hyperparameters.
why: >-
  Their errors are partly independent, so the average has lower variance than any single model, and the
  score depends less on a lucky seed.
see_also:
- stacking
- weighted-blend
code: |
  # seed × fold bagging; bootstrap bagging; averaging differently configured models
  for s in range(SEEDS):
      for a, b in StratifiedKFold(FOLDS, shuffle=True, random_state=s).split(X, y):
          m = lgb.LGBMClassifier(**params, random_state=s).fit(X.iloc[a], y.iloc[a])
          oof[b] += m.predict_proba(X.iloc[b])[:, 1] / SEEDS
          test_pred += m.predict_proba(X_test)[:, 1] / (SEEDS * FOLDS)

  for b in range(25):
      idx = rng.choice(len(X), len(X), replace=True)
      lr.fit(X.iloc[idx], y.iloc[idx])
      test_pred_lr += lr.predict_proba(X_test)[:, 1] / 25

  test_pred = np.mean([m.predict_proba(X_test)[:, 1] for m in (model_a, model_b, model_c)], axis=0)
translations:
  ru:
    name: Бэггинг
    do: >-
      Усредняйте предсказания моделей, которые отличаются только сидом, фолдом CV, бутстрэп-выборкой или
      гиперпараметрами.
    why: >-
      Их ошибки частично независимы, поэтому у среднего меньше дисперсия, чем у любой отдельной модели,
      и оценка меньше зависит от удачного сида.
