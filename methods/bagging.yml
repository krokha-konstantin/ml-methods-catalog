section: universal
subsection: ensembling
order: 10
grade: book
name: Bagging
description: >-
  Average the predictions of models that differ only by random seed, CV fold, bootstrap sample or hyperparameters.
  Their errors are partly independent, so the average has lower variance than any single model; it also
  makes the score less dependent on a lucky seed.
code: |
  for s in range(SEEDS):
      for a, b in StratifiedKFold(FOLDS, shuffle=True, random_state=s).split(X, y):
          m = lgb.LGBMClassifier(**params, random_state=s).fit(X.iloc[a], y.iloc[a], ...)
          oof[b] += m.predict_proba(X.iloc[b])[:, 1] / SEEDS
          pt += m.predict_proba(Xt)[:, 1] / (SEEDS * FOLDS)

  for b in range(25):
      idx = rng.choice(len(train_f), len(train_f), replace=True)
      lr.fit(train_f.iloc[idx], y.iloc[idx])
      test_preds_lr += lr.predict_proba(test_f)[:, 1] / 25
  cb = CatBoostClassifier(iterations=100, depth=2, l2_leaf_reg=20)
  final_proba = 0.6 * test_preds_lr + 0.4 * cb.fit(...).predict_proba(...)[:, 1]

