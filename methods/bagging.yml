translations:
  ru:
    name: Бэггинг
    description: >-
      Усредняйте предсказания моделей, которые отличаются только сидом, фолдом CV, бутстрэп-выборкой или
      гиперпараметрами. Их ошибки частично независимы, поэтому среднее имеет меньшую дисперсию, чем любая
      отдельная модель, и оценка меньше зависит от удачного сида.
