section: universal
subsection: ensembling
order: 20
grade: book
general: true
name: Stacking with a constrained meta-model
do: Train a simple meta-model on the out-of-fold predictions of the base models.
why: >-
  Constraining it (non-negative weights, strong regularisation) keeps it from overfitting the few, highly
  correlated inputs it has.
see_also:
- bagging
- k-fold-oof
code: |
  # non-negative ridge over base-model OOF predictions, itself evaluated out-of-fold
  OOF = pd.DataFrame(oof_cols); TEST = pd.DataFrame(test_cols)   # one column per booster
  rid = Ridge(alpha=1.66, positive=True, fit_intercept=True)
  for tr, va in cv.split(OOF.values, y, groups=g):
      rid.fit(OOF.values[tr], y[tr]); meta[va] = rid.predict(OOF.values[va])
  rid.fit(OOF.values, y); meta_test = rid.predict(TEST.values)
translations:
  ru:
    name: Стекинг с ограниченной мета-моделью
    do: Обучите простую мета-модель на out-of-fold предсказаниях базовых моделей.
    why: >-
      Ограничения (неотрицательные веса, сильная регуляризация) не дают ей переобучиться на немногих сильно
      коррелированных входах.
