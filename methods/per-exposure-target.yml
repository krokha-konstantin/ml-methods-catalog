section: time-series
subsection: target
order: 30
grade: book
name: Normalise the target by exposure
description: >-
  Divide the target by the amount of opportunity behind it (days in the period, opening hours, number
  of users) and multiply back after predicting. The model no longer has to learn the arithmetic of period
  lengths or calendar quirks.
code: |
  df["month_days"] = df["month"].map(DAYS_IN_MONTH)
  df.loc[df["n"] == LEAP_MONTH_N, "month_days"] = LEAP_FEB_DAYS
  df["rto"] /= df["month_days"]
translations:
  ru:
    name: Нормируйте целевую переменную на экспозицию
    description: >-
      Разделите целевую переменную на объём возможностей за ней (дни в периоде, часы работы, число пользователей)
      и умножьте обратно после предсказания. Модели больше не нужно выучивать арифметику длины периодов
      и календарных особенностей.
