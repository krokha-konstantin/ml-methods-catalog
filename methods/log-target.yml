section: tabular
subsection: features
order: 10
grade: book
name: Log-transform a skewed target
when: The regression target is skewed, with a few very large values.
do: Train on log(1 + y) and invert the predictions.
why: >-
  Errors become relative instead of absolute, so the few large targets no longer dominate the loss.
see_also:
- per-exposure-target
code: |
  # train on log1p, predict with expm1
  y = np.log1p(train['target'])
  preds = np.expm1(model.predict(X_test))
translations:
  ru:
    name: Логарифмирование скошенной целевой переменной
    when: 'Целевая переменная регрессии скошена: есть несколько очень больших значений.'
    do: Обучайтесь на log(1 + y) и обращайте предсказания.
    why: >-
      Ошибки становятся относительными, а не абсолютными, и несколько больших значений перестают доминировать
      в функции потерь.
