section: tabular
subsection: features
order: 70
grade: book
general: true
name: Domain-knowledge features
do: >-
  Compute the quantities practitioners of the domain already use: physical laws, standard indices, derived
  rates.
why: >-
  A known formula costs one line to add, while a model would need far more data to rediscover it.
see_also:
- domain-calendar
code: |
  # examples: material flow rate, a colour index, the sun's elevation
  X['flow_rate'] = X['speed'] * X['layer_height'] * X['nozzle_diameter']
  X['colour_index'] = X['mag_blue'] - X['mag_visual']

  decl = 23.44 * math.sin(math.radians(360 / 365 * (day_of_year - 81)))
  hour_angle = math.radians(15 * (local_time - 12))
  sin_elev = math.sin(lat) * math.sin(decl) + math.cos(lat) * math.cos(decl) * math.cos(hour_angle)
translations:
  ru:
    name: Признаки из знаний о предметной области
    do: >-
      Вычислите величины, которыми уже пользуются специалисты предметной области: физические законы, стандартные
      индексы, производные показатели.
    why: >-
      Известная формула добавляется одной строкой, а модели понадобилось бы гораздо больше данных, чтобы
      открыть её заново.
