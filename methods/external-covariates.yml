section: time-series
subsection: features
order: 40
grade: book
name: External covariates
description: >-
  Add external series that drive the target (macroeconomic indicators, weather) at the time resolution
  of the data. Use the actual published series: approximations add noise, not signal.
code: |
  if year == 2023:
      df.at[period, "real_income_yoy"] = 105.4
      df.at[period, "overall_cpi_yoy"] = round(2.5 + (month * 0.45), 2) if month < 8 else 7.42
translations:
  ru:
    name: Внешние ковариаты
    description: >-
      Добавьте внешние ряды, влияющие на целевую переменную (макроэкономические показатели, погода), в
      временном разрешении данных. Используйте реальные опубликованные ряды: приближения добавляют шум,
      а не сигнал.
