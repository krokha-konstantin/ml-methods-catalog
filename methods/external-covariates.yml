section: time-series
subsection: features
order: 40
grade: book
name: External covariates
do: >-
  Add external series that drive the target (macroeconomic indicators, weather) at the time resolution
  of the data, using only values published before the forecast date.
why: >-
  They explain shifts the target's own history can't. Use the actual published series: approximations
  add noise, not signal.
see_also:
- domain-calendar
sketch: true
code: |
  # join published monthly indicators, lagged to what was known at forecast time
  macro = pd.read_csv("indicators.csv", parse_dates=["month"])          # official releases
  macro[["cpi_yoy", "real_income_yoy"]] = macro[["cpi_yoy", "real_income_yoy"]].shift(PUBLICATION_LAG)
  df = df.merge(macro, on="month", how="left")
translations:
  ru:
    name: Внешние ковариаты
    do: >-
      Добавьте внешние ряды, влияющие на целевую переменную (макроэкономические показатели, погода), во
      временном разрешении данных, используя только значения, опубликованные до даты прогноза.
    why: >-
      Они объясняют сдвиги, которые не видны в собственной истории ряда. Берите реальные опубликованные
      ряды: приближения добавляют шум, а не сигнал.
