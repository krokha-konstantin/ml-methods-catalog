section: theory
order: 10
grade: book
name: Partial and lagged correlation
description: >-
  Partial correlation removes the effect of a third variable; lagged cross-correlation, computed per entity
  and then averaged, shows which of two series leads the other.
code: |
  def partial_corr(x, y, z):
      r_xy, r_xz, r_yz = x.corr(y), x.corr(z), y.corr(z)
      return (r_xy - r_xz * r_yz) / np.sqrt((1 - r_xz ** 2) * (1 - r_yz ** 2))
  per_sat = [g['solar_panel_temp_mean'].corr(g['battery_temp_mean'].shift(-lag)) for _, g in data.groupby('satellite_id')]
translations:
  ru:
    name: Частная и лаговая корреляция
    description: >-
      Частная корреляция убирает влияние третьей переменной; лаговая взаимная корреляция, посчитанная
      по каждой сущности и затем усреднённая, показывает, какой из двух рядов опережает другой.
