section: vision
subsection: super-resolution
order: 20
grade: good
name: Use a differentiable copy of the metric as the loss
when: The metric is a weighted sum of differentiable terms.
do: >-
  Implement the same terms with the official weights in the training framework and train on them directly,
  often with an extra plain L1 term for stability.
why: >-
  The model optimises exactly what is scored instead of a proxy that ranks solutions differently.
see_also:
- metric-weighted-loss
- reproduce-the-metric-exactly
- select-checkpoint-by-metric
code: |
  # differentiable copy of the competition metric (SSIM + MAE + gradient + Laplacian terms)
  def metric_loss(out, y):
      nmae = (out - y).abs().mean()
      grad_err = (grad_mag(out) - grad_mag(y)).abs().mean() / (2 * math.sqrt(2))
      lap_err = (filt(out, lap_k, 1) - filt(y, lap_k, 1)).abs().mean() / 4
      return 0.33 * (1 - ssim_t(out, y)) + 1.27 * nmae + 0.16 * grad_err + 0.22 * lap_err
translations:
  ru:
    name: Используйте дифференцируемую копию метрики как функцию потерь
    when: Метрика — взвешенная сумма дифференцируемых слагаемых.
    do: >-
      Реализуйте те же слагаемые с официальными весами во фреймворке обучения и учитесь прямо на них,
      часто с добавочным L1 для устойчивости.
    why: >-
      Модель оптимизирует ровно то, что оценивается, а не заменитель, который упорядочивает решения иначе.
