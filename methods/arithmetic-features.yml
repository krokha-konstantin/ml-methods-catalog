section: tabular
subsection: features
order: 30
grade: book
general: true
name: Ratios, differences and cyclic encodings
do: >-
  Add ratios, differences and products of related columns, and encode cyclic values (month, hour) as sine
  and cosine.
why: >-
  Trees split one feature at a time, so such combinations are hard for them to learn on their own.
see_also:
- domain-knowledge-features
code: |
  # differences, ratios and a cyclic encoding
  X['temp_diff'] = X['temp_inside'] - X['temp_outside']
  X['mass_per_area'] = X['mass'] / X['area']
  X['time_per_mass'] = X['duration'] / X['mass']
  X['month_sin'] = np.sin(2 * np.pi * X['month'] / 12)
  X['month_cos'] = np.cos(2 * np.pi * X['month'] / 12)
translations:
  ru:
    name: Отношения, разности и циклическое кодирование
    do: >-
      Добавьте отношения, разности и произведения связанных столбцов, а циклические величины (месяц, час)
      закодируйте синусом и косинусом.
    why: >-
      Деревья делят по одному признаку за раз, поэтому такие комбинации им трудно выучить самостоятельно.
