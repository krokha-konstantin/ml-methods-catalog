section: puzzles
subsection: simulation
order: 20
grade: good
name: Pool observations across agents
when: Several agents move through the same environment.
do: Merge what each of them reveals into one shared model of the environment.
why: Parts seen by only one agent still constrain the others' predictions.
see_also:
- event-based-map-reconstruction
code: |
  # one shared map from both agents' observations
  combined = pd.concat([observations_agent1, observations_agent2])
  for _, row in combined.iterrows():
      env_map.setdefault((row['cell_x'], row['cell_y']), []).append(row['angle_deg'])
translations:
  ru:
    name: Объединяйте наблюдения разных агентов
    when: Несколько агентов движутся в одной среде.
    do: Объединяйте то, что открывает каждый, в одну общую модель среды.
    why: Части, увиденные только одним агентом, всё равно ограничивают предсказания для остальных.
