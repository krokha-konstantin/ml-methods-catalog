section: planning
subsection: model-based
order: 40
grade: book
name: Common random numbers
when: Candidate plans are compared by simulation.
do: Evaluate all candidates on the same random draws.
why: >-
  Their difference then reflects the plans, not the luck of the draw, so far fewer simulations are needed.
see_also:
- prefix-cached-coordinate-ascent
code: |
  E, U = draw_noise(n_scenarios, rng)    # drawn once...
  for plan in candidate_plans:
      score[plan] = simulate(plan, init_state, E, U).mean()   # ...reused for every plan → paired comparison
translations:
  ru:
    name: Общие случайные числа
    when: Планы-кандидаты сравниваются симуляцией.
    do: Оценивайте всех кандидатов на одних и тех же случайных реализациях.
    why: >-
      Тогда их разница отражает сами планы, а не удачу выборки, и симуляций нужно гораздо меньше.
