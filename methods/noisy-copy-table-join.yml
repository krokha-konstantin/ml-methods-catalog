section: tabular
subsection: features
order: 80
grade: good
name: Join an extra table that is a noisy copy of the training data
description: >-
  If a second table holds the same rows with extra columns but noisy shared values, match each training
  row to its counterpart (nearest neighbour on the scaled shared columns, i.e. record linkage) and join
  the real extra columns. If rows can't be matched, the fallback is a multi-output model that predicts
  the extra columns from the shared ones.
example: star classification, a catalogue of extended stellar parameters
code: |
  common_cols = list(set(data_train.columns) & set(data_extra.columns))
  target_cols = [c for c in data_extra.columns if c not in data_train.columns]
  model = CatBoostRegressor(objective='MultiRMSE')
  model.fit(data_extra[common_cols], data_extra[target_cols])
  data_train[target_cols] = model.predict(data_train[common_cols])

  common = sorted(set(data_train.columns) & set(data_extra.columns) - {'variable'})
  scale = data_extra[common].std()
  nn = NearestNeighbors(n_neighbors=1).fit(data_extra[common] / scale)
  dist, idx = nn.kneighbors(data_train[common] / scale)
  data_train[target_cols] = data_extra.iloc[idx[:, 0]][target_cols].to_numpy()
  # check the dist histogram: true matches sit at the noise level, far below the next neighbour
translations:
  ru:
    name: Присоедините дополнительную таблицу, которая является зашумлённой копией обучающей
    description: >-
      Если во второй таблице те же строки с дополнительными столбцами, но общие значения зашумлены, сопоставьте
      каждой обучающей строке её пару (ближайший сосед по масштабированным общим столбцам, то есть связывание
      записей) и присоедините настоящие дополнительные столбцы. Если строки не сопоставляются, запасной
      вариант — модель с несколькими выходами, предсказывающая дополнительные столбцы по общим.
    example: классификация звёзд, каталог расширенных параметров звёзд
