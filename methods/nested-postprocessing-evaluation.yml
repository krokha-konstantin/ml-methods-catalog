section: universal
subsection: validation
order: 50
grade: good
general: true
name: Nested evaluation of tuned post-processing
when: A threshold or cut-off is tuned on OOF predictions.
do: >-
  Choose it on the other folds and apply it to the held-out fold, instead of tuning and scoring on the
  same predictions.
why: >-
  Tuning on the scored predictions is optimistic; if that optimism exceeds the gain of a new idea, OOF
  "improvements" won't reproduce on the leaderboard.
see_also:
- positive-share-transfer
- threshold-tuning
code: |
  # honest score of a tuned cut-off: tune on the other folds, apply to the held-out one
  def honest_rank_metric(y_true, scores, folds, beta=2.0):
      predictions = np.zeros_like(y_true)
      for fold in sorted(np.unique(folds)):
          fit = folds != fold
          valid = np.flatnonzero(folds == fold)
          count = int(np.argmax(fbeta_rank_curve(y_true[fit], scores[fit], beta)))
          take = int(round(count / fit.sum() * len(valid)))     # share chosen out-of-fold
          order = valid[np.argsort(-scores[valid], kind="mergesort")]
          predictions[order[:take]] = 1
      return fbeta_score(y_true, predictions, beta=beta, average="macro")
translations:
  ru:
    name: Вложенная оценка подобранной постобработки
    when: Порог или отсечка подбирается на OOF-предсказаниях.
    do: >-
      Подбирайте его на остальных фолдах и применяйте к отложенному, а не подбирайте и оценивайте на одних
      и тех же предсказаниях.
    why: >-
      Подбор на оцениваемых предсказаниях даёт завышенную оценку; если завышение больше выигрыша от новой
      идеи, «улучшения» на OOF не повторятся на лидерборде.
