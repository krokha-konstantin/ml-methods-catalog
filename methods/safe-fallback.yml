section: vision
subsection: geometry
order: 50
grade: book
name: Safe fallback for failed cases
description: >-
  When the pipeline fails on an input (too few matches), output the answer that minimises the expected
  error, such as the mean direction with the median scale, instead of a crash or an arbitrary value.
code: |
  def fallback():   # identity rotation, mean translation direction × median scale
      return np.array([1, 0, 0, 0]), mean_dir * median_scale
translations:
  ru:
    name: Безопасный запасной ответ при сбоях
    description: >-
      Когда пайплайн не справляется с входом (слишком мало сопоставлений), выдавайте ответ, минимизирующий
      ожидаемую ошибку, например среднее направление с медианным масштабом, а не падение или произвольное
      значение.
