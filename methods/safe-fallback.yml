section: vision
subsection: geometry
order: 50
grade: book
name: Safe fallback for failed cases
when: The pipeline can fail on some inputs (too few matches).
do: >-
  Output the answer that minimises the expected error, such as the mean direction with the median scale.
why: A crash or an arbitrary value costs far more than a sensible average.
see_also:
- learned-scale
- predictability-horizon
code: |
  def fallback():   # identity rotation, mean translation direction × median scale
      return np.array([1, 0, 0, 0]), mean_dir * median_scale
translations:
  ru:
    name: Безопасный запасной ответ при сбоях
    when: Пайплайн может не справиться с некоторыми входами (слишком мало сопоставлений).
    do: >-
      Выдавайте ответ, минимизирующий ожидаемую ошибку, например среднее направление с медианным масштабом.
    why: Падение или произвольное значение обходятся гораздо дороже разумного среднего.
