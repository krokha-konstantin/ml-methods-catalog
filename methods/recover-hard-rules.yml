section: planning
subsection: model-based
order: 20
grade: good
name: Recover hard rules from the data
when: The logs come from a system with deterministic limits.
do: >-
  Look for such rules (an outcome that always fails above a threshold) and hard-code them in the simulator.
why: A smooth model blurs a hard limit into a gradual decline.
see_also:
- learned-simulator
code: |
  # a hard threshold found in the logs, enforced exactly
  THRESHOLD = {'A': 28.0, 'B': 31.0, 'C': 34.0}   # above it the action always fails
  ok = (state_value < THRESHOLD[kind]) & (u < p_success)
translations:
  ru:
    name: Восстановите жёсткие правила по данным
    when: Логи получены от системы с детерминированными ограничениями.
    do: >-
      Ищите такие правила (исход, который всегда неудачен выше порога) и зашивайте их в симулятор.
    why: Гладкая модель размывает жёсткую границу в плавный спад.
