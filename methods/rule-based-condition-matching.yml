section: nlp
order: 40
grade: good
name: Rule-based attribute extraction and matching
description: >-
  Extract a few structured attributes from each text with regular expressions, taking nearby negation
  into account. For text pairs, add flags for whether each attribute matches, is missing, or contradicts.
  Exact constraints that a bag of words dilutes become explicit features.
code: |
  for title_pattern, protocol_pattern in CONCEPT_PATTERNS.values():   # sex, age, pregnancy, severity...
      title_has = bool(re.search(title_pattern, title))
      m = re.search(protocol_pattern, protocol)
      negated = m is not None and bool(NEGATION_RE.search(protocol[max(0, m.start() - 55):m.start()]))
      values += [title_has, m is not None, title_has and m and not negated, title_has and not m, title_has and m and negated]
translations:
  ru:
    name: Извлечение и сопоставление атрибутов правилами
    description: >-
      Извлеките из каждого текста несколько структурированных атрибутов регулярными выражениями с учётом
      отрицания рядом. Для пар текстов добавьте флаги: атрибут совпадает, отсутствует или противоречит.
      Точные ограничения, которые размываются в мешке слов, становятся явными признаками.
