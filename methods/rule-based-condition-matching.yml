section: nlp
order: 40
grade: good
name: Rule-based condition extraction and matching
description: >-
  Extract a small set of structured conditions (sex, age group, pregnancy, severity, …) from each text
  with regular expressions, including nearby negation, and add match / missing / contradicted flags as
  features.
example: clinical guideline matching, 17 condition rules
code: |
  for title_pattern, protocol_pattern in CONCEPT_PATTERNS.values():   # sex, age, pregnancy, severity...
      title_has = bool(re.search(title_pattern, title))
      m = re.search(protocol_pattern, protocol)
      negated = m is not None and bool(NEGATION_RE.search(protocol[max(0, m.start() - 55):m.start()]))
      values += [title_has, m is not None, title_has and m and not negated, title_has and not m, title_has and m and negated]
translations:
  ru:
    name: Извлечение и сопоставление условий правилами
    description: >-
      Извлекайте небольшой набор структурированных условий (пол, возрастная группа, беременность, тяжесть,
      …) из каждого текста регулярными выражениями с учётом отрицания поблизости и добавляйте флаги совпадения
      / отсутствия / противоречия как признаки.
    example: сопоставление клинических рекомендаций, 17 правил для условий
