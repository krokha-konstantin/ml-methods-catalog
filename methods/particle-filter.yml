section: tracking
order: 10
grade: book
general: true
name: Particle filter
when: >-
  A hidden state (position and rate) has to be tracked through noisy observations, and its dynamics or
  noise are not Gaussian.
do: >-
  Represent the state by weighted samples: move them by a motion model, re-weight each by how well it
  explains the next observation, then resample. Systematic resampling with a little added noise (roughening)
  keeps the particles diverse.
why: It handles non-linear, multi-modal posteriors that a Kalman filter can't.
see_also:
- trackers-as-features
code: |
  # systematic resampling with roughening noise (numba-compiled)
  @njit(cache=True)
  def _resamp(pos, aux, w, N, rp, rv):
      cum = np.zeros(N + 1)
      for j in range(N): cum[j + 1] = cum[j] + w[j]
      u0 = np.random.uniform(0., 1. / N); np2 = np.empty(N); na = np.empty(N); ci = 0
      for j in range(N):
          u = u0 + j / N
          while ci < N - 1 and cum[ci + 1] < u: ci += 1
          np2[j] = pos[ci] + rp * np.random.randn(); na[j] = aux[ci] + rv * np.random.randn()
      return np2, na
translations:
  ru:
    name: Фильтр частиц
    when: >-
      Скрытое состояние (положение и скорость) нужно отслеживать по шумным наблюдениям, а его динамика
      или шум не гауссовы.
    do: >-
      Представьте состояние взвешенными сэмплами: сдвигайте их по модели движения, перевзвешивайте по
      тому, насколько каждый объясняет следующее наблюдение, затем делайте ресэмплинг. Систематический
      ресэмплинг с небольшим добавленным шумом (roughening) сохраняет разнообразие частиц.
    why: >-
      Справляется с нелинейными многомодальными апостериорными распределениями, которые не под силу фильтру
      Калмана.
