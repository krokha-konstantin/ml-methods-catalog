section: signals
order: 30
grade: good
name: Treat a few-valued target as classes
when: A regression target takes only a handful of distinct values.
do: Predict it as a class.
why: >-
  A classifier can't output impossible in-between values, and its probabilities still give an expected
  value if the metric needs one.
see_also:
- attention-pooling
code: |
  # 8 possible target values → 8 classes
  self.possible_values = possible_values            # the target takes 8 values
  self.fc = nn.Linear(hidden_size * seq_length, len(possible_values))
  self.label_to_index = {val: idx for idx, val in enumerate(possible_values)}
translations:
  ru:
    name: Цель с немногими значениями — это классы
    when: Целевая переменная регрессии принимает лишь несколько различных значений.
    do: Предсказывайте её как класс.
    why: >-
      Классификатор не может выдать невозможное промежуточное значение, а его вероятности всё равно дают
      ожидаемое значение, если оно нужно метрике.
