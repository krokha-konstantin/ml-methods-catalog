section: universal
subsection: hyperparameters
order: 20
grade: book
name: Coarse-to-fine grid search
description: >-
  Search a coarse grid first, then refine repeatedly around the best few points with a finer step. It
  finds a near-exact optimum of a low-dimensional, non-smooth objective at a tiny fraction of the cost
  of a full fine grid.
example: satellite risk analytics, ensemble weights on grids of 1/20 → 1/2000 → 1/20000
code: |
  L1, _ = run(jobs, 20)                                   # weights on a 1/20 grid, all model triples
  top = np.argsort(L1.min(1))[:5]
  for ti in top:
      for step, half in [(2000, 60), (20000, 30)]:        # zoom in around the best point
          w = grid(step, np.round(u[:2] * step).astype(int), half)
          L, th = run(np.column_stack([np.tile(t, (len(w), 1)), w]), step)
          u = w[L.argmin()] / step
translations:
  ru:
    name: Поиск по сетке от грубой к точной
    description: >-
      Сначала перебирайте грубую сетку, затем многократно уточняйте вокруг нескольких лучших точек с меньшим
      шагом. Так находится почти точный оптимум маломерной негладкой функции за малую долю стоимости полного
      перебора по мелкой сетке.
    example: анализ рисков спутников, веса ансамбля на сетках 1/20 → 1/2000 → 1/20000
