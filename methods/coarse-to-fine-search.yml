section: universal
subsection: hyperparameters
order: 20
grade: book
general: true
name: Coarse-to-fine grid search
when: >-
  A low-dimensional, non-smooth objective (blend weights, thresholds) needs a near-exact optimum.
do: >-
  Search a coarse grid first, then refine repeatedly around the best few points with a finer step.
why: It reaches the optimum at a tiny fraction of the cost of a full fine grid.
see_also:
- hyperparameter-search
code: |
  # 1/20 grid over blend weights, then zoom in twice around the 5 best points
  L1, _ = run(jobs, 20)                                   # weights on a 1/20 grid, all model triples
  top = np.argsort(L1.min(1))[:5]
  for ti in top:
      for step, half in [(2000, 60), (20000, 30)]:        # zoom in around the best point
          w = grid(step, np.round(u[:2] * step).astype(int), half)
          L, th = run(np.column_stack([np.tile(t, (len(w), 1)), w]), step)
          u = w[L.argmin()] / step
translations:
  ru:
    name: Поиск по сетке от грубой к точной
    when: Маломерную негладкую функцию (веса бленда, пороги) нужно оптимизировать почти точно.
    do: >-
      Сначала переберите грубую сетку, затем многократно уточняйте вокруг нескольких лучших точек с меньшим
      шагом.
    why: Оптимум находится за малую долю стоимости полного перебора по мелкой сетке.
