section: universal
subsection: thresholds
order: 40
grade: good
name: Adjust the positive rate for label shift
description: >-
  If the test set's mix of groups differs from train, the expected share of positives differs too. Estimate
  it from per-group training priors weighted by the test's group mix, and rescale the transferred share
  accordingly.
code: |
  def expected_positive_rate(frame, priors, global_mean):
      return float(priors.reindex(frame["title_text"].map(extract_leaf)).fillna(global_mean).mean())
  share_multiplier = expected_positive_rate(test, priors, m) / expected_positive_rate(train, priors, m)
translations:
  ru:
    name: Поправка доли положительных на сдвиг меток
    description: >-
      Если состав групп в тесте отличается от обучающего, ожидаемая доля положительных тоже другая. Оцените
      её по априорным долям групп из обучения, взвешенным по составу теста, и масштабируйте переносимую
      долю.
