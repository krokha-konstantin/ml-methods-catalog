section: universal
subsection: validation
order: 90
grade: book
name: Move most of a large validation set into training
when: The provided validation set is large.
do: Train on most of it and keep only a small holdout for model selection.
why: More training data usually helps more than a large validation set does.
see_also:
- fix-boosting-rounds-then-refit
code: |
  # keep 30 validation items as holdout, move the rest into training
  HOLDOUT = val_ids[100:130]
  EXTRA = val_ids[:100] + val_ids[130:]
  train_x = np.concatenate([load_inputs(train_ids), load_inputs(EXTRA)])
translations:
  ru:
    name: Перенос большей части большой валидации в обучение
    when: Выданная валидационная выборка велика.
    do: >-
      Обучайтесь на большей её части и оставьте лишь небольшую отложенную выборку для выбора модели.
    why: Больше обучающих данных обычно полезнее, чем большая валидация.
