section: universal
subsection: leaderboard
order: 50
grade: good
name: Sanity-check a submission's implied statistics
do: >-
  Before submitting, compute the aggregates the predictions imply (median growth, positive rate, mean
  level) and compare them with history and with a known-good submission.
why: A systematic bias shows up there long before the leaderboard does.
see_also:
- reproducible-submission
sketch: true
code: |
  # growth implied by the submission vs a known-good reference
  implied_mom = (pred / last_month_actual).median() - 1     # this submission +9.4% vs reference +11.5%
  implied_yoy = (pred / same_month_last_year).median() - 1  # this submission +7.5% vs reference +9.5%
translations:
  ru:
    name: Проверяйте статистики, которые подразумевает посылка
    do: >-
      Перед отправкой посчитайте агрегаты, которые следуют из предсказаний (медианный рост, доля положительных,
      средний уровень), и сравните их с историей и с заведомо хорошей посылкой.
    why: Систематическое смещение видно там задолго до лидерборда.
