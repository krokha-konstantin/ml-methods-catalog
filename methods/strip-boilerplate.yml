section: nlp
order: 80
grade: book
name: Strip boilerplate from long documents
description: >-
  Remove repetitive structured parts (lab tables, templates) before vectorising, so the narrative that
  carries the signal isn't drowned by tokens that appear everywhere.
example: clinical guideline matching, lab-table rows removed from patient protocols
code: |
  for line in str(text).splitlines():
      normalized = normalize_text(line)
      if normalized and not normalized.startswith("показатель:"):   # lab-table rows
          useful.append(normalized)
translations:
  ru:
    name: Убирайте шаблонный текст из длинных документов
    description: >-
      Удаляйте повторяющиеся структурированные части (таблицы анализов, шаблоны) перед векторизацией,
      чтобы несущий сигнал текст не тонул в токенах, которые встречаются везде.
    example: >-
      сопоставление клинических рекомендаций, строки таблиц анализов удалены из протоколов пациентов
