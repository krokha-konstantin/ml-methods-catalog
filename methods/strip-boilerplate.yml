section: nlp
order: 80
grade: book
name: Strip boilerplate from long documents
description: >-
  Remove repetitive structured parts (tables, templates, signatures) before vectorising, so the narrative
  that carries the signal isn't drowned by tokens that appear everywhere.
code: |
  for line in str(text).splitlines():
      normalized = normalize_text(line)
      if normalized and not normalized.startswith("показатель:"):   # lab-table rows
          useful.append(normalized)
translations:
  ru:
    name: Удаляйте шаблонный текст из длинных документов
    description: >-
      Удалите повторяющиеся структурированные части (таблицы, шаблоны, подписи) до векторизации, чтобы
      содержательный текст, несущий сигнал, не тонул в токенах, которые встречаются везде.
