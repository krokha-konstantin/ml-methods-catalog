section: tabular
subsection: features
order: 40
grade: book
name: Missingness indicators
when: Columns have missing values.
do: Add a flag per such column, plus the number of missing values per row.
why: Whether a value is missing is often informative in itself.
code: |
  # missingness as features
  X[f'{col}_is_missing'] = X[col].isna().astype(int)
  df['n_missing'] = df.isna().sum(axis=1)
translations:
  ru:
    name: Индикаторы пропусков
    when: В столбцах есть пропуски.
    do: Добавьте флаг для каждого такого столбца и число пропусков в строке.
    why: Сам факт пропуска часто несёт информацию.
