section: planning
subsection: games
order: 10
grade: good
name: Online opponent modelling
description: >-
  When the opponent is a fixed but unknown policy, summarise its observed choices during the game (e.g.
  which rank of the available options it tends to give away) and adapt your strategy to that estimate.
example: two-player number game
code: |
  lo, mid, hi = sorted(range(3), key=lambda i: t[i])
  rank = 0.5 if t[lo] == t[hi] else {lo: 0.0, mid: 0.5, hi: 1.0}[give - 1]
  opp_ranks.append(rank)
translations:
  ru:
    name: Моделирование соперника по ходу игры
    description: >-
      Когда соперник — фиксированная, но неизвестная стратегия, по ходу игры обобщайте его наблюдаемые
      выборы (например, какой по величине из доступных вариантов он обычно отдаёт) и подстраивайте свою
      стратегию под эту оценку.
    example: игра двух игроков с числами
