section: planning
subsection: games
order: 10
grade: good
name: Online opponent modelling
description: >-
  When the opponent is a fixed but unknown policy, summarise its observed choices during the game and
  adapt your strategy to that estimate. A strategy tuned to the actual opponent beats one that assumes
  a generic one.
code: |
  lo, mid, hi = sorted(range(3), key=lambda i: t[i])
  rank = 0.5 if t[lo] == t[hi] else {lo: 0.0, mid: 0.5, hi: 1.0}[give - 1]
  opp_ranks.append(rank)
translations:
  ru:
    name: Моделирование соперника по ходу игры
    description: >-
      Если соперник следует фиксированной, но неизвестной стратегии, обобщайте его наблюдаемые ходы по
      ходу игры и подстраивайте свою стратегию под эту оценку. Стратегия под реального соперника обыгрывает
      стратегию против абстрактного.
