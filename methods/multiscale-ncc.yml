section: tracking
order: 30
grade: book
name: Multi-scale normalised cross-correlation
description: >-
  Find where a window of the signal best matches a reference by normalised cross-correlation, at several
  window sizes, and combine the scales weighted by match quality. Normalisation makes the match insensitive
  to gain and offset.
code: |
  Cn = (C - C.mean(1, keepdims=True)) / (C.std(1, keepdims=True) + 1e-6)   # reference windows
  Hn = (H - H.mean(1, keepdims=True)) / (H.std(1, keepdims=True) + 1e-6)   # query windows
  ncc = Hn @ Cn.T / win; best = ncc.argmax(1); score = ncc.max(1)
  sw = np.exp(3. * scores); sw /= sw.sum(1, keepdims=True)                   # blend scales 8/15/25
translations:
  ru:
    name: Многомасштабная нормированная взаимная корреляция
    description: >-
      Находите, где окно сигнала лучше всего совпадает с эталоном, по нормированной взаимной корреляции
      на нескольких размерах окна, и объединяйте масштабы с весами по качеству совпадения. Нормировка
      делает сопоставление нечувствительным к усилению и смещению.
