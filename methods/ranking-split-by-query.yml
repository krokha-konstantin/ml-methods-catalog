section: universal
subsection: validation
order: 70
grade: good
name: For ranking tasks, split by query
description: >-
  All candidates of one query go to the same fold. Otherwise the ranker has seen the query's other candidates
  during training, and tuning selects settings that overfit.
sketch: true
code: |
  for tr, va in GroupKFold(5).split(X, y, groups=query_id):   # all candidates of a query stay together
      ranker.fit(X[tr], y[tr]); score_mrr(ranker, X[va], y[va], query_id[va])
translations:
  ru:
    name: В задачах ранжирования разбивайте по запросу
    description: >-
      Все кандидаты одного запроса попадают в один фолд. Иначе ранкер уже видел на обучении других кандидатов
      этого запроса, и подбор выбирает переобученные настройки.
