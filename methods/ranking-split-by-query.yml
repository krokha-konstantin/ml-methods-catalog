section: universal
subsection: validation
order: 70
grade: good
name: For ranking tasks, split by query
when: The task ranks candidates for each query.
do: Put all candidates of one query in the same fold.
why: >-
  Otherwise the ranker has seen the query's other candidates in training, and tuning selects settings
  that overfit.
see_also:
- group-k-fold
sketch: true
code: |
  for tr, va in GroupKFold(5).split(X, y, groups=query_id):   # all candidates of a query stay together
      ranker.fit(X[tr], y[tr]); score_mrr(ranker, X[va], y[va], query_id[va])
translations:
  ru:
    name: В задачах ранжирования разбивайте по запросу
    when: Задача — ранжировать кандидатов для каждого запроса.
    do: Все кандидаты одного запроса попадают в один фолд.
    why: >-
      Иначе ранкер уже видел на обучении других кандидатов этого запроса, и подбор выбирает переобученные
      настройки.
