section: universal
subsection: thresholds
order: 10
grade: book
general: true
name: Tune the decision threshold on OOF predictions
when: The metric depends on a hard decision (F1 and similar), especially with class imbalance.
do: >-
  Choose the probability cut-off on out-of-fold predictions and apply it to the test predictions.
why: The best cut-off is rarely 0.5.
see_also:
- all-thresholds-in-one-pass
- nested-postprocessing-evaluation
- positive-share-transfer
code: |
  # best F1 cut-off on OOF predictions
  ths = np.arange(0.15, 0.7, 0.01)
  scores = [f1_score(y, oof > t, average='macro') for t in ths]
  thr = ths[int(np.argmax(scores))]
translations:
  ru:
    name: Подбор порога решения на OOF-предсказаниях
    when: Метрика зависит от жёсткого решения (F1 и подобные), особенно при дисбалансе классов.
    do: Подберите порог вероятности на out-of-fold предсказаниях и примените его к тесту.
    why: Лучший порог редко равен 0.5.
