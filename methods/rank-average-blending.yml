section: universal
subsection: ensembling
order: 40
grade: book
name: Rank averaging
when: >-
  Models output scores on different scales (probabilities, anomaly scores, hand-made formulas).
do: Convert each model's scores to ranks before averaging.
why: >-
  For ranking metrics such as ROC-AUC only the order matters, and ranks make the weights comparable.
see_also:
- weighted-blend
code: |
  # blend ranks, not raw scores
  blend = (w_lr * rankdata(oof_lr) + w_heuristic * rankdata(heuristic_score)
           + w_gbm * rankdata(oof_gbm) + w_iso * rankdata(iso_score))
translations:
  ru:
    name: Усреднение рангов
    when: Модели выдают оценки в разных шкалах (вероятности, оценки аномальности, ручные формулы).
    do: Переведите оценки каждой модели в ранги перед усреднением.
    why: >-
      Для метрик ранжирования вроде ROC-AUC важен только порядок, а ранги делают веса сопоставимыми.
