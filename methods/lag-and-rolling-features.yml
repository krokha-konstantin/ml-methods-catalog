section: time-series
subsection: features
order: 10
grade: book
name: Lags and rolling statistics
description: >-
  Past values (lags), rolling means, std, min, max and exponentially weighted means, plus ratios between
  them, all shifted so they only use data available at prediction time.
example: retail sales forecasting, lags 1–14 and rolling windows 3/6/12
code: |
  for lag in range(1, 15):
      df[f'rto_lag_{lag}'] = g['rto'].shift(lag)
  shifted = g['rto'].shift(1)
  for win in [3, 6, 12]:
      df[f'rto_rmean_{win}'] = shifted.groupby(df['new_id']).rolling(win, min_periods=1).mean().reset_index(level=0, drop=True).values
  df['rto_yoy_lag1'] = df['rto_lag_1'] / df['rto_lag_13']
translations:
  ru:
    name: Лаги и скользящие статистики
    description: >-
      Прошлые значения (лаги), скользящие средние, стандартные отклонения, минимумы, максимумы и экспоненциально
      взвешенные средние, а также отношения между ними; всё со сдвигом, чтобы использовались только данные,
      доступные на момент предсказания.
    example: прогноз продаж ритейла, лаги 1–14 и скользящие окна 3/6/12
