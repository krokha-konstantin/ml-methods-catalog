section: universal
subsection: ensembling
order: 60
grade: book
name: Leave-one-model-out ablation
do: >-
  Remove each model from the ensemble in turn, renormalise the remaining weights and re-score.
why: A model whose removal costs nothing adds complexity without signal and can be dropped.
see_also:
- dirichlet-weight-search
- univariate-auc-filter
code: |
  # score change when each component is dropped
  for name in WEIGHTS:
      remaining = [c for c in WEIGHTS if c != name]
      total = sum(WEIGHTS[c] for c in remaining)
      without = sum(WEIGHTS[c] / total * components[c] for c in remaining)
      rows.append({"model": name, "drop_delta": metric(y_true, without) - blend_metric})
translations:
  ru:
    name: Абляция с исключением одной модели
    do: >-
      По очереди убирайте каждую модель из ансамбля, перенормируйте оставшиеся веса и пересчитывайте метрику.
    why: >-
      Модель, удаление которой ничего не стоит, добавляет сложность без сигнала, и её можно убрать.
