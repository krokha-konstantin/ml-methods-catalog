section: nlp
order: 20
grade: book
name: Blend a linear model with nearest neighbours
do: Add a cosine k-nearest-neighbour score over known examples to the linear model's score.
why: >-
  The kNN part captures local similarity to specific known items that a single linear boundary misses.
code: |
  # cosine kNN over the training vectors, blended with the linear score
  neighbours = NearestNeighbors(n_neighbors=3, metric="cosine").fit(train_matrix)
  distances, indices = neighbours.kneighbors(valid_matrix)
  knn_score = (1 - distances) @ np.ones(3) / 3
  score = w * linear_score + (1 - w) * knn_score
translations:
  ru:
    name: Смешайте линейную модель с ближайшими соседями
    do: >-
      Добавьте к оценке линейной модели оценку k ближайших соседей по косинусной мере среди известных
      примеров.
    why: >-
      Часть kNN улавливает локальное сходство с конкретными известными элементами, которое одна линейная
      граница упускает.
