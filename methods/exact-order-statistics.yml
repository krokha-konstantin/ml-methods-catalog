section: planning
subsection: games
order: 20
grade: good
name: Exact expected order statistics instead of simulation
description: >-
  When future outcomes depend on how a known pool of values will be grouped at random, compute the expected
  minimum, median and maximum per group exactly with combinatorics rather than estimating them by simulation.
example: two-player number game, expected values of future triples
code: |
  vals = sorted(pool.elements()); N = len(vals); denom = _comb2(N - 1)
  sum_min = sum(vals[k] * _comb2(N - 1 - k) for k in range(N)) / denom
  sum_max = sum(vals[k] * _comb2(k) for k in range(N)) / denom
  sum_mid = sum(vals[k] * k * (N - 1 - k) for k in range(N)) / denom
  # interpolate by the learned avg_rank, scale by opponent rounds left, subtract from what we still owe
translations:
  ru:
    name: Точные ожидания порядковых статистик вместо симуляции
    description: >-
      Когда будущие исходы зависят от того, как известный набор значений случайно разобьётся на группы,
      считайте ожидаемые минимум, медиану и максимум по группе точно, комбинаторикой, а не оценивайте
      симуляцией.
    example: игра двух игроков с числами, ожидаемые значения будущих троек
