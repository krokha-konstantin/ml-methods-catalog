section: universal
subsection: validation
order: 60
grade: good
general: true
name: Check the public test for leakage before trusting local scores
when: Local scores on the public test look near-perfect.
do: >-
  Check whether public test rows are copies of training rows. If they are, build a holdout that mimics
  the hidden test instead, for example by removing the leaked source from the training or reference data.
why: On leaked rows every method looks perfect, while the hidden test behaves differently.
see_also:
- link-additional-data
sketch: true
code: |
  # share of public-test rows that have an (almost) identical row in train
  nn = NearestNeighbors(n_neighbors=1).fit(train_features)
  dist, _ = nn.kneighbors(public_test_features)
  print((dist[:, 0] < 1e-6).mean())   # a large share → local scores on this test mean nothing
  # then validate on a holdout that mimics the hidden test, e.g. without the leaked source
translations:
  ru:
    name: Проверка публичного теста на утечку до того, как доверять локальным оценкам
    when: Локальные оценки на публичном тесте выглядят почти идеальными.
    do: >-
      Проверьте, не являются ли строки публичного теста копиями обучающих. Если да, соберите отложенную
      выборку, похожую на скрытый тест, например убрав утёкший источник из обучающих или справочных данных.
    why: На утёкших строках любой метод выглядит идеальным, а скрытый тест ведёт себя иначе.
