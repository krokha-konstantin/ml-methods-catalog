section: universal
subsection: validation
order: 10
grade: book
general: true
name: K-fold cross-validation with out-of-fold (OOF) predictions
do: >-
  Split the training data into K folds; train K models, each predicting the one fold it did not see, and
  average their test predictions.
why: 'Every training row gets an honest prediction: an unbiased score, and inputs for stacking.'
see_also:
- oof-target-encoding
- stacking
code: |
  # K-fold: out-of-fold predictions for train, fold-averaged predictions for test
  for fold, (tr_idx, val_idx) in enumerate(kf.split(X)):
      model.fit(X.iloc[tr_idx], y.iloc[tr_idx], eval_set=(X.iloc[val_idx], y.iloc[val_idx]))
      oof_preds[val_idx] = model.predict(X.iloc[val_idx])
      test_preds += model.predict(X_test) / FOLDS
translations:
  ru:
    name: K-fold кросс-валидация с out-of-fold (OOF) предсказаниями
    do: >-
      Разбейте обучающие данные на K фолдов; обучите K моделей, каждая предсказывает тот фолд, которого
      не видела, а предсказания на тесте усредните.
    why: >-
      Каждая обучающая строка получает честное предсказание: несмещённую оценку и входы для стекинга.
