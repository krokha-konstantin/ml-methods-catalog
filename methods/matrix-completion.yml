section: nlp
order: 70
grade: brilliant
name: Matrix completion for pairwise classification
when: Rows are pairs (entity × question) and many pairs are labelled.
do: >-
  Arrange the labels into an entity × question matrix and fill in the missing cells with a low-rank completion
  (iterative SVD).
why: >-
  It is collaborative filtering applied to classification: it uses the structure of which pairs are positive
  without reading any text.
see_also:
- oof-target-encoding
code: |
  # rank-1 iterative SVD completion of the entity × question label matrix
  matrix[entity_index[row.entity], question_index[row.question]] = row.label   # NaN = unknown
  completed = bias.copy(); completed[observed_mask] = matrix[observed_mask]
  for _ in range(50):
      left, singular, right = np.linalg.svd(completed - global_mean, full_matrices=False)
      reconstruction = np.clip(global_mean + (left[:, :1] * singular[:1]) @ right[:1], 0, 1)
      completed[~observed_mask] = reconstruction[~observed_mask]
  prediction = np.clip((completed + bias) / 2, 0, 1)
translations:
  ru:
    name: Восполнение матрицы для попарной классификации
    when: Строки — пары (сущность × вопрос), и многие пары размечены.
    do: >-
      Сложите метки в матрицу сущность × вопрос и заполните пропущенные ячейки восполнением низкого ранга
      (итеративное SVD).
    why: >-
      Это коллаборативная фильтрация, применённая к классификации: она использует структуру того, какие
      пары положительны, не читая никакого текста.
