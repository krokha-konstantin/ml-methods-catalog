section: nlp
order: 70
grade: brilliant
name: Matrix completion for pairwise classification
description: >-
  If the rows are pairs (entity × question) and many pairs are labelled, arrange the labels into an entity
  × question matrix and fill in the missing cells with a low-rank completion (iterative SVD). It is collaborative
  filtering applied to a classification task, and uses the structure of which pairs are positive without
  reading any text.
code: |
  matrix[protocol_index[row.protocol_text], title_index[row.title_text]] = row.label   # NaN = unknown
  completed = bias.copy(); completed[observed_mask] = matrix[observed_mask]
  for _ in range(50):
      left, singular, right = np.linalg.svd(completed - global_mean, full_matrices=False)
      reconstruction = np.clip(global_mean + (left[:, :1] * singular[:1]) @ right[:1], 0, 1)
      completed[~observed_mask] = reconstruction[~observed_mask]
  prediction = np.clip((completed + bias) / 2, 0, 1)
translations:
  ru:
    name: Восполнение матрицы для попарной классификации
    description: >-
      Если строки — пары (сущность × вопрос) и многие пары размечены, сложите метки в матрицу сущность
      × вопрос и заполните пропущенные ячейки восполнением низкого ранга (итеративное SVD). Это коллаборативная
      фильтрация, применённая к задаче классификации: она использует структуру того, какие пары положительны,
      не читая никакого текста.
