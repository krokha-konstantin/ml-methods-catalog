section: vision
subsection: detection-segmentation
order: 10
grade: book
name: Fine-tune a pretrained detector
description: >-
  Start from a pretrained detector (such as YOLO) and fine-tune it with mosaic and flip augmentation,
  switching mosaic off for the last epochs so the model sees realistic images before training ends.
code: |
  model = YOLO('yolo11s.pt')
  model.train(data=str(DATA_YAML), epochs=25, imgsz=768, mosaic=1.0, fliplr=0.5, close_mosaic=5)
translations:
  ru:
    name: Дообучение предобученного детектора
    description: >-
      Начните с предобученного детектора (например, YOLO) и дообучите его с аугментациями mosaic и отражением,
      отключив mosaic на последних эпохах, чтобы перед концом обучения модель видела реалистичные изображения.
