section: vision
subsection: detection-segmentation
order: 10
grade: book
name: Fine-tune a pretrained detector
do: >-
  Start from a pretrained detector (such as YOLO) and fine-tune it with mosaic and flip augmentation,
  switching mosaic off for the last epochs.
why: >-
  Pretraining makes small datasets enough; the last mosaic-free epochs let the model see realistic images
  before training ends.
code: |
  # fine-tune a pretrained YOLO; mosaic off for the last 5 epochs
  model = YOLO('yolo11s.pt')
  model.train(data='data.yaml', epochs=25, imgsz=768, mosaic=1.0, fliplr=0.5, close_mosaic=5)
translations:
  ru:
    name: Дообучение предобученного детектора
    do: >-
      Начните с предобученного детектора (например, YOLO) и дообучите его с аугментациями mosaic и отражением,
      отключив mosaic на последних эпохах.
    why: >-
      Предобучение позволяет обойтись небольшим датасетом; последние эпохи без mosaic показывают модели
      реалистичные изображения перед концом обучения.
