section: vision
subsection: matching
order: 20
grade: good
name: Enforce one-to-one matching
when: Each gallery item can be the answer for only one query.
do: >-
  Don't match queries independently: remove an item once it is matched (greedy) or solve a global assignment
  (Hungarian algorithm).
why: >-
  Constraints between queries resolve ambiguous ones, and a hard query can be solved through a chain of
  easier matches.
see_also:
- partial-fine-tune-contrastive
code: |
  # greedy one-to-one: an item, once matched, is no longer a candidate
  used = set()
  for query, anchor in confident_matches.items():
      sims = [(g, cos(gallery[anchor], f)) for g, f in gallery.items() if g != anchor and g not in used]
      best = max(sims, key=lambda s: s[1])[0]
      used.add(best)

  rows, cols = linear_sum_assignment(-similarity)   # or the global optimum
translations:
  ru:
    name: Навяжите взаимно однозначное сопоставление
    when: Каждый элемент галереи может быть ответом только для одного запроса.
    do: >-
      Не сопоставляйте запросы независимо: убирайте элемент после сопоставления (жадно) или решайте глобальную
      задачу о назначениях (венгерский алгоритм).
    why: >-
      Ограничения между запросами разрешают неоднозначные случаи, а трудный запрос решается через цепочку
      более лёгких сопоставлений.
