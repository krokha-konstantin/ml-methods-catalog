section: theory
order: 60
grade: good
name: Exploit symmetry to shrink the search
description: >-
  If the data and the model class share a symmetry (separating lines through the centre of a point-symmetric
  set), points and their mirror images always land on opposite sides. Pairs whose contribution is the
  same for every model can be dropped, and only the rest needs optimising.
code: |
  # a cell and its mirror image through the centre always fall on opposite sides of the line:
  # same colour → exactly one of the pair is right, whatever the line;
  # different colours → both right or both wrong, depending on the line.
  # Only the asymmetric pairs depend on the line, which bounds the best achievable accuracy.
translations:
  ru:
    name: Используйте симметрию, чтобы сократить перебор
    description: >-
      Если у данных и класса моделей общая симметрия (разделяющие прямые через центр центрально-симметричного
      множества), точка и её зеркальное отражение всегда оказываются по разные стороны. Пары, вклад которых
      одинаков для любой модели, можно отбросить и оптимизировать только остальные.
