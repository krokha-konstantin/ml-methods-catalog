section: universal
subsection: thresholds
order: 30
grade: good
name: Transfer the positive share, not the score threshold
when: Test predictions come from models whose calibration may differ from the OOF models'.
do: >-
  Find the optimal number of positives on OOF predictions and label the same share of test rows positive
  (top-N by score).
why: A share survives a shift in score calibration; a raw score threshold does not.
see_also:
- label-shift-correction
- nested-postprocessing-evaluation
- threshold-tuning
code: |
  # transfer the share of positives from OOF to test
  positive_count = best_oof_rank(labels, oof_scores)                       # e.g. 427 of 690
  n_test = int(round(positive_count / len(oof_scores) * len(test_scores)))  # -> 107 of 173
  order = np.argsort(-test_scores, kind="mergesort")
  predictions[order[:n_test]] = 1
translations:
  ru:
    name: Переносите долю положительных, а не порог оценки
    when: Предсказания на тесте делают модели, калибровка которых может отличаться от OOF-моделей.
    do: >-
      Найдите оптимальное число положительных на OOF-предсказаниях и отметьте ту же долю тестовых строк
      (top-N по оценке).
    why: Доля переживает сдвиг калибровки, а сырой порог по оценке — нет.
