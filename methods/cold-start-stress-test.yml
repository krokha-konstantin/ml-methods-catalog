section: universal
subsection: validation
order: 40
grade: good
name: Cold-start stress test
when: The test set may contain entities never seen in training.
do: Next to the normal CV, also run a CV grouped by that entity.
why: >-
  The gap between the two scores shows how much the model relies on memorising known entities.
see_also:
- group-k-fold
- shallow-regularised-trees
code: |
  # same pipeline, harder split: no entity appears in both train and validation
  groups = train["entity_id"]
  splitter = StratifiedGroupKFold(n_splits=n_splits, shuffle=True, random_state=SEED)
  for fold, (_, valid_index) in enumerate(splitter.split(train, labels, groups=groups)):
      folds[valid_index] = fold
  oof = run_pipeline_oof(train, test, precomputed_folds=folds)
translations:
  ru:
    name: Стресс-тест холодного старта
    when: В тесте могут встретиться сущности, которых не было в обучении.
    do: Помимо обычной CV запустите CV с группировкой по этой сущности.
    why: >-
      Разница между двумя оценками показывает, насколько модель держится на запоминании известных сущностей.
