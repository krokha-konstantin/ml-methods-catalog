section: puzzles
subsection: simulation
order: 30
grade: book
name: Vectorised ray–segment collision simulation
when: A particle moves among straight walls.
do: >-
  Step it forward, intersect its path with all wall segments at once (vectorised), and reflect it specularly
  off the nearest hit.
why: Vectorising over segments keeps a long simulation fast enough to fit parameters by trial.
see_also:
- system-identification
code: |
  # ray-segment intersection against all walls, specular reflection
  denom = d[0] * seg_E[:, 1] - d[1] * seg_E[:, 0]
  t_arr = (fx * seg_E[:, 1] - fy * seg_E[:, 0]) * inv_d
  s_arr = (fx * d[1] - fy * d[0]) * inv_d
  hit = safe & (t_arr > 1e-6) & (t_arr <= speed) & (s_arr >= 0) & (s_arr <= 1)
  d = d - 2 * np.dot(d, n) * n                       # reflect off the nearest hit
translations:
  ru:
    name: Векторизованная симуляция столкновений луча с отрезками
    when: Частица движется среди прямых стенок.
    do: >-
      Продвигайте её на шаг, пересекайте путь сразу со всеми отрезками стенок (векторизованно) и отражайте
      зеркально от ближайшего пересечения.
    why: >-
      Векторизация по отрезкам делает долгую симуляцию достаточно быстрой для подбора параметров перебором.
