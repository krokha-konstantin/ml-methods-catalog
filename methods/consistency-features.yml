section: tabular
subsection: features
order: 90
grade: good
name: Consistency features
when: Several fields should agree (two answers to the same question, a total and its parts).
do: >-
  Encode whether they do: agreement flags, contradictions, and the joint combination as one category.
why: >-
  How a person or process breaks the rules is often a strong signature of who or what produced the row.
code: |
  # does the stated preference agree with the two ratings?
  expected = np.select([pref == "a", pref == "b"], [1, -1], default=0)
  df["is_consistent"] = (np.sign(df["rating_diff"]) == expected).astype(int)
  df["contradiction_bothbad_highrating"] = ((pref == "both_bad") & ((df["rating_a"] == 2) | (df["rating_b"] == 2))).astype(int)
  df["combo"] = pref.astype(str) + "_" + df["rating_a_i"] + "_" + df["rating_b_i"]
translations:
  ru:
    name: Признаки согласованности
    when: Несколько полей должны согласовываться (два ответа на один вопрос, итог и его слагаемые).
    do: >-
      Закодируйте, согласуются ли они: флаги совпадения, противоречия и их совместная комбинация как одна
      категория.
    why: То, как человек или процесс нарушает правила, часто выдаёт, кто или что породило строку.
