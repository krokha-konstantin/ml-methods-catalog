section: tabular
subsection: features
order: 90
grade: good
name: Consistency features
description: >-
  When several fields should agree (a rating and a stated preference), encode whether they do: agreement
  flags, contradictions and the joint combination as one category. How a person or process breaks the
  rules is often a strong signature of who or what produced the row.
example: annotator identification, rating difference vs stated preference
code: |
  expected = np.select([pref == "a", pref == "b"], [1, -1], default=0)
  df["is_consistent"] = (np.sign(df["rating_diff"]) == expected).astype(int)
  df["contradiction_bothbad_highrating"] = ((pref == "both_bad") & ((df["rating_a"] == 2) | (df["rating_b"] == 2))).astype(int)
  df["combo"] = pref.astype(str) + "_" + df["rating_a_i"] + "_" + df["rating_b_i"]
translations:
  ru:
    name: Признаки согласованности
    description: >-
      Если несколько полей должны согласовываться (оценка и заявленное предпочтение), закодируйте, согласуются
      ли они: флаги согласия, противоречия и совместную комбинацию как одну категорию. То, как человек
      или процесс нарушает правила, часто служит сильной подписью того, кто или что породил строку.
    example: определение аннотатора, разница оценок против заявленного предпочтения
