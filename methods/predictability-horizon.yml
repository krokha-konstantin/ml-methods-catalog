section: puzzles
subsection: simulation
order: 50
grade: good
name: Switch to the best constant beyond the predictability horizon
when: A simulation of a chaotic system is used for forecasting.
do: >-
  Measure on held-out data at which step its error exceeds that of the best constant prediction (e.g.
  the mean position), and switch to the constant from that step on.
why: Past the predictability horizon the simulation is worse than knowing nothing.
see_also:
- safe-fallback
- system-identification
code: |
  # best switch step K: simulate before K, predict the constant after
  cumsum_sim = np.cumsum(avg_errs)
  cumsum_center_rev = np.cumsum(center_errs[::-1])[::-1]
  for K in range(0, N_TEST + 1):          # simulate steps < K, predict the centre for steps >= K
      total = cumsum_sim[K - 1] + cumsum_center_rev[K]
      if total / N_TEST < best_err: best_err, best_K = total / N_TEST, K
translations:
  ru:
    name: Переходите на лучшую константу за горизонтом предсказуемости
    when: Для прогноза используется симуляция хаотической системы.
    do: >-
      Измерьте на отложенных данных, на каком шаге её ошибка превышает ошибку лучшего константного предсказания
      (например, среднего положения), и с этого шага переходите на константу.
    why: За горизонтом предсказуемости симуляция хуже, чем полное незнание.
