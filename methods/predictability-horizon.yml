section: physics
order: 50
grade: good
name: Switch to the best constant beyond the predictability horizon
description: >-
  A simulation of a chaotic system diverges from reality after a while. Measure on held-out data when
  its error exceeds that of the best constant prediction (the mean position), and switch to the constant
  from that step on.
code: |
  cumsum_sim = np.cumsum(avg_errs)
  cumsum_center_rev = np.cumsum(center_errs[::-1])[::-1]
  for K in range(0, N_TEST + 1):          # simulate steps < K, predict the centre for steps >= K
      total = cumsum_sim[K - 1] + cumsum_center_rev[K]
      if total / N_TEST < best_err: best_err, best_K = total / N_TEST, K
translations:
  ru:
    name: Переходите на лучшую константу за горизонтом предсказуемости
    description: >-
      Симуляция хаотической системы со временем расходится с реальностью. Измерьте на отложенных данных,
      когда её ошибка превышает ошибку лучшего константного предсказания (среднего положения), и с этого
      шага переходите на константу.
