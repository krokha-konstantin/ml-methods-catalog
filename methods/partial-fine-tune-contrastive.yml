section: vision
subsection: matching
order: 10
grade: book
name: Contrastive fine-tuning of the last layers
description: >-
  Freeze a pretrained encoder except its last few blocks and train it with a symmetric InfoNCE loss on
  positive pairs, using the other items in the batch as negatives. Little data suffices because most of
  the representation is kept.
code: |
  for p in self.clip_model.parameters(): p.requires_grad = False
  for i in range(total_blocks - unfreeze_last_n_layers, total_blocks):
      for p in self.clip_model.visual.transformer.resblocks[i].parameters(): p.requires_grad = True
  logits = (orig_feat @ crop_feat.t()) / 0.07
  loss = 0.5 * (F.cross_entropy(logits, labels) + F.cross_entropy(logits.t(), labels))
translations:
  ru:
    name: Контрастивное дообучение последних слоёв
    description: >-
      Заморозьте предобученный энкодер, кроме нескольких последних блоков, и обучайте его симметричной
      функцией InfoNCE на положительных парах, используя остальные элементы батча как отрицательные. Хватает
      немного данных, потому что большая часть представления сохраняется.
