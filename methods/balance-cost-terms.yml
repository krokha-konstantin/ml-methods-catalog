section: tracking
order: 60
grade: good
name: Keep the cost terms on comparable scales
when: A cost is made of several terms (mismatch + movement penalty).
do: After any normalisation, check the magnitudes of all terms.
why: >-
  Rescaling one term silently changes the trade-off: normalising the signal can shrink the mismatch term
  until the penalty dominates and the optimum stops responding to the data.
see_also:
- sequence-alignment
sketch: true
code: |
  cost = (observed[i] - reference[state]) ** 2 / sigma + mu * abs(state - prev_state)
  # with a z-scored signal: mismatch term ≈ 0.03 vs movement term 4–35 → the optimum is "stay put"
translations:
  ru:
    name: Держите слагаемые стоимости в сопоставимых масштабах
    when: Стоимость состоит из нескольких слагаемых (несовпадение + штраф за движение).
    do: После любой нормализации проверяйте величины всех слагаемых.
    why: >-
      Изменение масштаба одного слагаемого незаметно меняет баланс: нормализация сигнала может уменьшить
      слагаемое несовпадения настолько, что доминирует штраф и оптимум перестаёт реагировать на данные.
