section: universal
subsection: hyperparameters
order: 10
grade: book
name: Hyperparameter search against the CV score
description: >-
  Search hyperparameters with Bayesian optimisation (e.g. Optuna's TPE) or a grid, scoring every candidate
  with the same cross-validation as the final model.
example: retail sales forecasting, Optuna over boosting parameters
sketch: true
code: |
  def objective(trial):
      params = {"num_leaves": trial.suggest_int("num_leaves", 15, 255), "learning_rate": trial.suggest_float("learning_rate", 0.01, 0.1, log=True)}
      return cv_mape(params)
  optuna.create_study(direction="minimize").optimize(objective, n_trials=100)
translations:
  ru:
    name: Подбор гиперпараметров по оценке CV
    description: >-
      Ищите гиперпараметры байесовской оптимизацией (например, TPE в Optuna) или по сетке, оценивая каждого
      кандидата той же кросс-валидацией, что и итоговую модель.
    example: прогноз продаж ритейла, Optuna по параметрам бустинга
