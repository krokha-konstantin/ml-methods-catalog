section: universal
subsection: validation
order: 20
grade: book
name: Group K-fold
when: >-
  Rows come in groups that share information (all readings of one session, consecutive video frames).
do: >-
  Keep each group entirely on one side of the split. Choose the group as the unit of correlation: if neighbouring
  groups are still near-duplicates, use a coarser unit such as a day.
why: Otherwise the model is scored on near-copies of its own training rows.
see_also:
- cold-start-stress-test
- ranking-split-by-query
code: |
  # split by group (session); a coarser unit (day) when neighbouring groups are near-duplicates
  gkf = GroupKFold(n_splits=5)
  for tr_idx, va_idx in gkf.split(X, y, groups):   # groups = session_id
      m = lgb.LGBMClassifier(**lgbm_params)
      m.fit(X.iloc[tr_idx], y[tr_idx], eval_set=[(X.iloc[va_idx], y[va_idx])],
            callbacks=[lgb.early_stopping(150, verbose=False)])
      oof_lgb[va_idx] = m.predict_proba(X.iloc[va_idx])[:, 1]

  days = sorted(set(p.name[:10] for p in imgs))      # file names start with the date
  random.Random(1).shuffle(days)
  val_days = set(days[:20])
  train_imgs = [p for p in imgs if p.name[:10] not in val_days]
  val_imgs = [p for p in imgs if p.name[:10] in val_days]
translations:
  ru:
    name: Group K-fold
    when: >-
      Строки образуют группы с общей информацией (все замеры одной сессии, последовательные кадры видео).
    do: >-
      Каждая группа целиком попадает по одну сторону разбиения. Группу выбирают по единице корреляции:
      если соседние группы всё ещё почти дублируют друг друга, берут более крупную единицу, например день.
    why: Иначе модель оценивается на почти-копиях собственных обучающих строк.
