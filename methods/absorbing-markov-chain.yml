name: 'Absorbing Markov chain: expected hitting time'
when: The expected time until a Markov chain reaches an absorbing state is needed.
do: >-
  Write one linear equation per state, E[x] = 1 + Σ p(x→y) E[y], with the absorbing transition removed,
  and solve the system; check by Monte Carlo.
why: It gives the exact answer, where simulation only approximates it.
code: |
  # E_X = 1 + Σ_Y p(X→Y)·E_Y, with the absorbing transition M→L dropped
  E = np.linalg.inv(A) @ b          # E_S = 173/12
