section: universal
subsection: hyperparameters
order: 30
grade: book
general: true
name: AdamW with warm-up and linear decay
when: A pretrained transformer is fine-tuned.
do: >-
  Use AdamW with weight decay, raise the learning rate linearly over the first few percent of steps, then
  decay it linearly to zero.
why: Warm-up keeps large early updates from damaging the pretrained weights; the decay settles the model at the end.
see_also:
- gradient-clipping
- fine-tune-pretrained-encoder
code: |
  # AdamW, 6% warm-up, linear decay to zero
  opt = torch.optim.AdamW(model.parameters(), lr=3e-5, weight_decay=0.01)
  total = epochs * len(loader)
  sched = get_linear_schedule_with_warmup(opt, int(0.06 * total), total)
  ...
  loss.backward(); opt.step(); sched.step(); opt.zero_grad()
translations:
  ru:
    name: AdamW с прогревом и линейным спадом
    when: Дообучается предобученный трансформер.
    do: >-
      Возьмите AdamW с weight decay, линейно поднимайте скорость обучения первые несколько процентов шагов,
      затем линейно снижайте её до нуля.
    why: Прогрев не даёт большим ранним шагам испортить предобученные веса; спад к нулю стабилизирует модель в конце.
