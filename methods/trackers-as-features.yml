section: tracking
order: 40
grade: good
name: Hand-built trackers as features for a learned model
when: Several hand-built trackers with different assumptions are available.
do: >-
  Run them with varied settings (seeds, noise scales, stiffness) and give their estimates, together with
  their disagreement, to a gradient-boosting model.
why: >-
  The model learns when to trust which tracker; the spread between them is a direct uncertainty signal.
see_also:
- particle-filter
- sequence-alignment
sketch: true
code: |
  # tracker outputs and their spread as boosting features
  estimates = np.stack([run_tracker(signal, **cfg) for cfg in TRACKER_CONFIGS], axis=1)
  features = pd.DataFrame(estimates, columns=[cfg["name"] for cfg in TRACKER_CONFIGS])
  features["tracker_mean"] = estimates.mean(1)
  features["tracker_std"] = estimates.std(1)            # disagreement = uncertainty
  model = lgb.LGBMRegressor().fit(features, y)
translations:
  ru:
    name: Ручные трекеры как признаки для обучаемой модели
    when: Есть несколько ручных трекеров с разными допущениями.
    do: >-
      Запустите их с разными настройками (сиды, масштаб шума, жёсткость) и передайте их оценки вместе
      с их расхождением модели градиентного бустинга.
    why: >-
      Модель учится, когда какому трекеру доверять; разброс между ними — прямой сигнал неопределённости.
