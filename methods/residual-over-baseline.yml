section: vision
subsection: super-resolution
order: 10
grade: book
name: Learn the residual over a simple baseline
when: A cheap baseline already gets close (bicubic upscaling).
do: Let the network predict only the correction to the baseline and add the two.
why: Training starts from a good solution and spends capacity on the missing detail.
see_also:
- predict-the-change
code: |
  # output = bicubic upscale + learned residual
  def forward(self, x):
      base = F.interpolate(x, scale_factor=4, mode="bicubic", align_corners=False)
      f = self.head(x)
      f = f + self.body(f)
      return base + self.up(f)          # up = 2× (conv → PixelShuffle(2))
translations:
  ru:
    name: Учите остаток поверх простого бейзлайна
    when: Дешёвый бейзлайн уже даёт близкий результат (бикубическое увеличение).
    do: Пусть сеть предсказывает только поправку к бейзлайну, и складывайте их.
    why: Обучение начинается с хорошего решения и тратит ёмкость на недостающие детали.
