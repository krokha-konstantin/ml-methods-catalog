section: vision
subsection: super-resolution
order: 10
grade: book
name: Learn the residual over a simple baseline
description: >-
  Let the network predict only the correction to a cheap baseline (bicubic upscaling) and add the two.
  It starts from a good solution and spends capacity on the missing detail.
code: |
  def forward(self, x):
      base = F.interpolate(x, scale_factor=4, mode="bicubic", align_corners=False)
      f = self.head(x)
      f = f + self.body(f)
      return base + self.up(f)          # up = 2× (conv → PixelShuffle(2))
translations:
  ru:
    name: Учите остаток поверх простого бейзлайна
    description: >-
      Пусть сеть предсказывает только поправку к дешёвому бейзлайну (бикубическому увеличению), и складывайте
      их. Сеть начинает с хорошего решения и тратит ёмкость на недостающие детали.
