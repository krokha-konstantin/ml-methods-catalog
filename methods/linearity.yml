section: theory
order: 20
grade: book
name: A network without nonlinearities is linear
description: >-
  Stacked linear layers without activations or biases collapse into one matrix, so outputs at new inputs
  follow from known outputs by linearity.
code: |
  # (-7, 6) = 3·(-2, 3) − (1, 3)  ⇒  T(-7, 6) = 3·T(-2, 3) − T(1, 3) = (-20, 70, 220) → clip → (0, 70, 220)
translations:
  ru:
    name: Сеть без нелинейностей линейна
    description: >-
      Последовательные линейные слои без активаций и смещений сворачиваются в одну матрицу, поэтому выходы
      на новых входах получаются из известных по линейности.
