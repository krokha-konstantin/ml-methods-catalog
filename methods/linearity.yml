section: puzzles
subsection: theory
order: 20
grade: book
name: A network without nonlinearities is linear
when: A network has no nonlinearities (no activations, no biases).
do: >-
  Treat it as one matrix: express a new input as a combination of known inputs and combine their outputs.
why: Stacked linear layers collapse into a single linear map.
code: |
  # (-7, 6) = 3·(-2, 3) − (1, 3)  ⇒  T(-7, 6) = 3·T(-2, 3) − T(1, 3) = (-20, 70, 220) → clip → (0, 70, 220)
translations:
  ru:
    name: Сеть без нелинейностей линейна
    when: В сети нет нелинейностей (ни активаций, ни смещений).
    do: 'Считайте её одной матрицей: выразите новый вход через известные и скомбинируйте их выходы.'
    why: Последовательные линейные слои сворачиваются в одно линейное отображение.
