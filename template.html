<!doctype html>
<html lang="{{DEFAULT_LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #fbfaf8; --panel: #f3f1ed; --text: #1f2328; --muted: #6a6f76; --line: #e2dfd8;
  --link: #2457c5; --code: #efece6; --pre: #f6f4f0;
  --book: #8a8f98; --good: #2f7d4f; --brilliant: #b26a00;
  --kw: #a3355c; --str: #2f7d4f; --num: #b05a00; --com: #8a8f98; --fn: #2457c5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --panel: #1d2025; --text: #e4e6ea; --muted: #9aa0a8; --line: #2c3037;
    --link: #7aa7ff; --code: #262a31; --pre: #1b1e23;
    --book: #8d939c; --good: #5cc78a; --brilliant: #f0a63a;
    --kw: #f07ca8; --str: #7fd49f; --num: #f0a63a; --com: #7d838c; --fn: #7aa7ff;
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --panel: #1d2025; --text: #e4e6ea; --muted: #9aa0a8; --line: #2c3037;
  --link: #7aa7ff; --code: #262a31; --pre: #1b1e23;
  --book: #8d939c; --good: #5cc78a; --brilliant: #f0a63a;
  --kw: #f07ca8; --str: #7fd49f; --num: #f0a63a; --com: #7d838c; --fn: #7aa7ff;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); max-width: 1200px; margin: 0 auto; }
aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 24px 16px;
  border-right: 1px solid var(--line); background: var(--panel); }
aside .title { font-weight: 700; margin-bottom: 12px; }
nav a { display: block; color: var(--text); padding: 3px 6px; border-radius: 4px; font-size: 13.5px; }
nav a:hover { background: var(--code); text-decoration: none; }
nav a.l3 { padding-left: 20px; color: var(--muted); font-size: 13px; }
.pane { display: none; }
.pane.active { display: block; }
.controls { display: grid; gap: 6px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.controls input[type=search], .controls select { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.controls label { font-size: 13.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.controls .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.controls button { font: inherit; font-size: 12.5px; padding: 3px 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; }
.count { font-size: 12.5px; color: var(--muted); }
main { padding: 32px 48px 80px; min-width: 0; }
h1 { font-size: 30px; margin: 0 0 12px; }
h2 { font-size: 22px; margin: 40px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); }
h3 { font-size: 17px; margin: 26px 0 6px; }
ul.legend { padding-left: 22px; }
.method { margin: 10px 0 14px; }
.method p { margin: 0; }
.method.hidden { display: none; }
.ex { color: var(--muted); }
.fallback { font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px dashed var(--muted);
  border-radius: 4px; padding: 0 4px; margin-left: 4px; cursor: help; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px;
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
details.snippet { margin: 4px 0 0; }
details.snippet summary { cursor: pointer; font-size: 12.5px; color: var(--muted); user-select: none; width: max-content; }
details.snippet summary:hover { color: var(--text); }
details.snippet .note { font-style: italic; }
pre { margin: 6px 0 0; padding: 12px 14px; background: var(--pre); border: 1px solid var(--line);
  border-radius: 8px; overflow-x: auto; }
pre code { background: none; padding: 0; font-size: 12.8px; line-height: 1.5; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--kw); }
.hljs-string { color: var(--str); }
.hljs-number { color: var(--num); }
.hljs-comment { color: var(--com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--fn); }
table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--panel); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 7px;
  border-radius: 999px; border: 1.5px solid currentColor; line-height: 1.5; vertical-align: 1px; margin-right: 2px; }
.badge.book { color: var(--book); }
.badge.good { color: var(--good); }
.badge.brilliant { color: var(--brilliant); }
mark { background: #ffe58a; color: #000; border-radius: 2px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
  nav { max-height: 220px; overflow-y: auto; }
  main { padding: 20px 16px 60px; }
}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="title" data-ui="title"></div>
  <div class="controls">
    <select id="lang" aria-label="Language">{{LANG_OPTIONS}}</select>
    <input type="search" id="q" data-ui-placeholder="search">
    <label><input type="checkbox" data-g="book"> <span class="badge book" data-ui-grade="book"></span></label>
    <label><input type="checkbox" data-g="good" checked> <span class="badge good" data-ui-grade="good"></span></label>
    <label><input type="checkbox" data-g="brilliant" checked> <span class="badge brilliant" data-ui-grade="brilliant"></span></label>
    <label><input type="checkbox" id="expand"> <span data-ui="expand"></span></label>
    <div class="row"><span class="count" id="count"></span><button id="theme" type="button" data-ui="theme"></button></div>
  </div>
{{NAVS}}
</aside>
<main>
{{PANES}}
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  var UI = {{UI}};
  if (window.hljs) document.querySelectorAll("pre code").forEach(function (el) { hljs.highlightElement(el); });

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var root = document.documentElement;
  var theme = store.get("mc-theme");
  if (theme) root.setAttribute("data-theme", theme);
  document.getElementById("theme").onclick = function () {
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next); store.set("mc-theme", next);
  };

  // Language: ?lang= beats the saved choice, which beats the browser language.
  var langSel = document.getElementById("lang");
  var params = new URLSearchParams(location.search);
  var browser = (navigator.language || "").slice(0, 2);
  var lang = [params.get("lang"), store.get("mc-lang"), browser, "{{DEFAULT_LANG}}"]
    .filter(function (l) { return l && UI[l]; })[0];

  var boxes = Array.prototype.slice.call(document.querySelectorAll("input[data-g]"));
  var expand = document.getElementById("expand");
  var q = document.getElementById("q");
  try {
    var s = JSON.parse(store.get("mc-filter") || "{}");
    boxes.forEach(function (b) { if (b.dataset.g in s) b.checked = s[b.dataset.g]; });
    expand.checked = !!s.expand;
  } catch (e) {}

  function setLang(l) {
    lang = l; langSel.value = l; store.set("mc-lang", l); root.lang = l;
    document.querySelectorAll(".pane").forEach(function (p) { p.classList.toggle("active", p.dataset.lang === l); });
    var ui = UI[l];
    document.querySelectorAll("[data-ui]").forEach(function (el) { el.textContent = ui[el.dataset.ui]; });
    document.querySelectorAll("[data-ui-grade]").forEach(function (el) { el.textContent = ui.grades[el.dataset.uiGrade]; });
    q.placeholder = ui.search;
    document.title = ui.title;
    apply();
    // Anchors are per language (#en-…, #ru-…): keep the reader at the same place after switching.
    var m = location.hash.match(/^#([a-z]+)-(.+)$/);
    if (m && UI[m[1]]) {
      var target = document.getElementById(l + "-" + m[2]);
      if (target) { history.replaceState(null, "", "#" + target.id); target.scrollIntoView(); }
    }
  }

  function clearMarks(node) {
    node.querySelectorAll("mark").forEach(function (m) {
      var p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize();
    });
  }
  function highlight(node, term) {
    var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) { return n.parentNode.closest("pre") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }
    }), texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(function (tn) {
      var i = tn.data.toLowerCase().indexOf(term);
      if (i === -1) return;
      var mid = tn.splitText(i); mid.splitText(term.length);
      var m = document.createElement("mark"); m.textContent = mid.data;
      mid.parentNode.replaceChild(m, mid);
    });
  }

  function apply() {
    var on = {}, state = { expand: expand.checked };
    boxes.forEach(function (b) { on[b.dataset.g] = b.checked; state[b.dataset.g] = b.checked; });
    store.set("mc-filter", JSON.stringify(state));
    var term = q.value.trim().toLowerCase(), shown = 0;
    var items = document.querySelectorAll('main .pane[data-lang="' + lang + '"] .method');
    items.forEach(function (el) {
      clearMarks(el);
      var ok = on[el.dataset.grade] && (!term || el.textContent.toLowerCase().indexOf(term) !== -1);
      el.classList.toggle("hidden", !ok);
      if (ok) { shown++; if (term) highlight(el, term); }
    });
    document.getElementById("count").textContent = shown + " / " + items.length + " " + UI[lang].methods;
  }
  function applyExpand() {
    document.querySelectorAll("details.snippet").forEach(function (d) { d.open = expand.checked; });
    apply();
  }

  boxes.forEach(function (b) { b.onchange = apply; });
  expand.onchange = applyExpand;
  q.oninput = apply;
  langSel.onchange = function () { setLang(langSel.value); };
  document.querySelectorAll("details.snippet").forEach(function (d) { d.open = expand.checked; });
  setLang(lang);
})();
</script>
</body>
</html>
